For everyone else: the entity itself AND the individuals responsible for approving the
payment. A finance manager who signs off a payment without deduction is personally exposed.

s.143(8): no recovery is made if the PAYEE has already paid everything due under s.143(2) and
(3) — so establishing that the supplier has paid its own tax is a real defence, but it must be
