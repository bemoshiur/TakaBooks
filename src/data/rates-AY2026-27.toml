# -----------------------------------------------------------------------------------------
# Environmental surcharge / পরিবেশ সারচার্জ — NEW, Finance Act 2026 Schedule 2 Part Three
# -----------------------------------------------------------------------------------------
# Paid by an individual who owns MORE THAN ONE motor car, at the rate below for EACH car in
# excess of one. It is a flat taka amount per car per year, not a percentage of anything, and it
# is due whether or not any wealth surcharge is payable. tax.py has no slot for it, so it is
# modelled here as its own band table; a later module can consume it unchanged.
#
# "Motor car" carries the same exclusions as the wealth surcharge: bus, minibus, coaster, prime
# mover, truck, lorry, tank lorry, dump truck, covered van, cargo van, pickup van, human hauler,
# tractor, maxi or auto rickshaw, crane, excavator, bulldozer, roller, concrete mixer, heavy
# motor vehicle, taxicab and motorcycle are NOT motor cars for this charge.
#
# WHICH car is the exempt one: NBR Paripatra 2026-27 §1.7 says only "for each car in excess of
# one" (একের অধিক প্রত্যেকটি গাড়ির জন্য) and does not say which car is left out. KPMG p.48 and
# TNP p.26 both say the car attracting the LOWEST surcharge is the exempt one. That reading is
# NOT confirmed by the Paripatra text — see `exempt_car_rule` below.

[income_tax.individual.environmental_surcharge]
basis = "per_motor_car_in_excess_of_one"
period = "per car, per year"
exempt_car_rule = "Professional summaries (KPMG p.48; TNP p.26) say the car attracting the lowest surcharge is the exempt one. NBR Paripatra 2026-27 §1.7 says only 'each car in excess of one' and does not identify which car is excluded. UNCONFIRMED — the reading matters only where the cars fall in different capacity bands."
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-07-01"
note = """
Finance Act 2026 Schedule 2 Part Three, reproduced at NBR Paripatra 2026-27 §1.7. Applies to
individuals (স্বাভাবিক ব্যক্তি) owning more than one motor car. Each band's `amount` is a rate
node; `engine_cc_above` and `engine_cc_upto` bound the band and are descriptive only.
"""

