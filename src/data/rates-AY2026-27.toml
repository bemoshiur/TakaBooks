  label_bn = "উপকরণ কর রেয়াত গ্রহণের সময়সীমা (কর মেয়াদ)"
  value = 6
  unit = "count"
  source = "http://bdlaws.minlaw.gov.bd/act-1106/section-42342.html"
  as_of = "2026-09-05"
  verified = true
  placeholder = false
  note = """
SIX. The credit must be taken in the tax period in which the input was purchased or acquired
— per the tax invoice or the goods declaration — or within the following SIX tax periods.
