# =========================================================================================
# TakaBooks — src/data/rates-AY2026-27.toml
# Machine-readable rates, thresholds, deadlines and policy switches for করবর্ষ /
# assessment year 2026-27 (income year 1 July 2025 – 30 June 2026, ended).
#
# TakaBooks — Moshiur Rahman (@bemoshiur) · Ticon Sys — https://ticonsys.com
#
# -----------------------------------------------------------------------------------------
# STATUS OF THIS FILE — read this before the numbers
# -----------------------------------------------------------------------------------------
# The earlier "THIS FILE CONTAINS NO REAL BANGLADESHI TAX FIGURE" banner is RETIRED. Real
# figures for AY 2026-27 have now been landed from primary and near-primary sources, so
# `[meta] placeholder` is false and `status` is no longer "placeholder". That switch matters:
#   * src/engine/rates.py no longer refuses the whole file outright, so tax.py will compute;
#   * individual nodes that are still unlanded keep `placeholder = true` and are STILL
#     refused one by one unless the caller passes --allow-placeholder-rates;
#   * every node with `verified = false` still produces a caveat line the user must be shown.
#
# `verified = false` at file level is deliberate and is NOT a formality. It says: some figures
# in this file rest on professional summaries rather than on enacted text. The reason is
# specific and documented — the Finance Act 2026 gazette PDF
# (https://nbr.gov.bd/uploads/acts/Finance_Act_2026.pdf) is typeset in a legacy Bijoy-family
# Bangla font whose glyphs map to ASCII, so its Schedules could not be text-extracted. Where a
# figure was instead read from NBR's own আয়কর পরিপত্র ২০২৬-২০২৭ (Income Tax Paripatra
# 2026-27), from bdlaws, or from a gazetted SRO, that node carries `verified = true`.
#
# -----------------------------------------------------------------------------------------
# HOW TO LAND A REAL FIGURE — this is the entire update procedure (spec §4.5, §6.1, §6.2)
# -----------------------------------------------------------------------------------------
#   1. Replace `value` with the figure read from a primary source.
#   2. Replace `source` with the exact URL of that primary source — the Finance Act, the SRO,
#      the NBR Paripatra, or the NBR page publishing it. Not a news article. Not a blog. Not
#      the bare https://nbr.gov.bd/ homepage: a URL that does not identify the instrument is
#      not a source.
#   3. Set `as_of` to the ISO date (YYYY-MM-DD) on which that instrument takes effect or was
#      published.
#   4. Set `verified = true` ONLY if you read the figure from primary text, and set
#      `placeholder = false`.
#   5. Rewrite `note` to say exactly what the figure covers and every condition attached.
#   If you could not confirm it from a primary source, leave `verified = false` and say WHY in
#   `note` — that text is shown to the end user as a warning, so write it for them. Absent
#   beats wrong: a figure nobody checked must never look checked.
#
# Updating TakaBooks for a new Finance Act = copy this file to rates-AY<next>.toml, land the
# new figures, add one compliance-calendar entry. No Python changes (spec §4.5).
#
# -----------------------------------------------------------------------------------------
# FILE FORMAT RULES — enforced by src/engine/rates.py, not merely conventions
# -----------------------------------------------------------------------------------------
#   * A "rate node" is any table carrying a `value` key. Everything else is metadata and is
#     not audited for verification.
#   * MONEY is in taka (BDT), never paisa. Whole taka as an integer (400000); anything with
#     decimals as a QUOTED string ("400000.50").
#   * PERCENTAGES are percent, never fractions: 15 means 15%. A value above 100 in a
#     `unit = "percent"` node is rejected as a fraction/percent mix-up.
#   * NEVER write a bare TOML float. `27.5` becomes a binary float and TakaBooks refuses to do
#     money arithmetic with floats (spec §4.2). Write "27.5". rates.py raises RatesError on any
#     float it finds in a rate node. Every half-point corporate rate in this file is therefore
#     a quoted string.
#   * Extra descriptive keys (label_en, label_bn, allowed, condition, covers, applies_to …)
#     are always permitted and are preserved for display.
#   * `unit` is free text; the units used here are "percent", "BDT", "date", "policy", "count"
#     and "cc" (engine displacement, used only by the environmental surcharge table).
#
# -----------------------------------------------------------------------------------------
# KEY PATHS — what the engine modules read (dotted keys, as passed to rates.py)
# -----------------------------------------------------------------------------------------
#   tax.py   income_tax.individual.default_category        (bare string)
#            income_tax.individual.default_location        (bare string)
#            income_tax.individual.thresholds.<category>   (BDT — tax-free threshold)
#            income_tax.individual.slabs                   (array of slab tables)
#            income_tax.individual.rebate.formula          (bare string: which construction)
#            income_tax.individual.rebate.rate             (percent of eligible investment)
#            income_tax.individual.rebate.income_cap_percent   (percent of taxable income)
#            income_tax.individual.rebate.absolute_cap     (BDT)
#            income_tax.individual.minimum_tax.applies_when    (policy switch)
#            income_tax.individual.minimum_tax.by_location.<tier>  (BDT)
#            income_tax.individual.minimum_tax.on_gross_receipts.rate         (percent)
#            income_tax.individual.minimum_tax.on_gross_receipts.applies_above (BDT)
#            income_tax.individual.surcharge.base          (policy switch)
#            income_tax.individual.surcharge.bands         (array of band tables)
#            income_tax.individual.surcharge.minimum       (BDT)
#   vat.py   vat.rates.standard, vat.rates.reduced.<key>, vat.thresholds.<key>,
#            vat.turnover_tax.rate, vds.services.<key>.rate
#   post.py / report.py read no rate at all — they only move money that already exists.
#
# -----------------------------------------------------------------------------------------
# HOW THIS FILE IS ORGANISED — and how to find the figure you want
# -----------------------------------------------------------------------------------------
#   [meta]                      what year this file is for, and how far it is verified
#   [income_tax.individual]     thresholds, slabs, rebate, minimum tax, both surcharges,
#                               capital gains and dividend rates
#   [income_tax.corporate]      entity rates, the bank-transfer condition, turnover tax by
#                               sector — schema for a later module; tax.py never reads it
#   [vat]                       standard/zero/reduced rates, thresholds, turnover tax,
#                               advance tax, filing mechanics, ITC, penalties, Mushak forms
#   [tds]                       one table per Income Tax Act 2023 section that withholds,
#                               plus deposit, return, certificate and penalty machinery
#   [vds]                       the Rule 3(1) VAT-withholding table, serial by serial
#   [deadlines]                 every filing and deposit date, stated as prose
#
# Each section carries its own comment block naming the instrument that sets its figures and
# the procedure for updating it after the next Finance Act. Read that block before editing
# anything inside the section — the instruments differ (an SRO for TDS, the VAT Act on
# bdlaws for VAT, NBR's Paripatra for the income tax rate card) and so do the traps.
#
# -----------------------------------------------------------------------------------------
# VERIFICATION CENSUS — a snapshot, not a contract
# -----------------------------------------------------------------------------------------
# At assembly (2026-09-06) this file held 436 rate nodes: 362 verified from primary text,
# 53 landed but resting on professional summaries or left as an openly contested reading
# (verified = false, each saying why in its own note), and 19 still placeholders that
# rates.py refuses outright. Those counts go stale
# the moment anybody edits a node, so do not trust them — recompute:
#
#     python3 src/engine/rates.py --assessment-year 2026-27 --all
#
# The file-level flags in [meta] are what the engine actually reads: `placeholder = false`
# lets rates.py open the file, `verified = false` keeps every output stamped provisional.
# Do not set [meta] verified = true until the audit above reports zero unverified nodes.
#
# Corporate figures live under [income_tax.corporate]. tax.py computes the INDIVIDUAL
# liability only; the corporate block is schema for a later module, not dead data.
# =========================================================================================


[meta]
assessment_year = "2026-27"
income_year = "2025-26"
income_year_start = "2025-07-01"
income_year_end = "2026-06-30"
currency = "BDT"
schema_version = 1
