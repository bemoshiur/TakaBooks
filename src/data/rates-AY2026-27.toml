as_of = "2016-11-03"
verified = true
note = "Rule number read from the primary Rules gazette. NBR does not publish this form on its VAT-2012 forms index. The VAT agent is appointed on Mushak 3.1 and certified on Mushak 3.2 under Rule 16."

[[vat.mushak_forms]]
form = "2.3"
label_bn = "নিবন্ধন সনদপত্র / তালিকাভুক্তি সনদপত্র"
label_en = "Registration certificate / enlistment certificate"
purpose = "Evidence of the BIN or of enlistment"
filed_by = "Issued by NBR — now by eVAT, immediately on approval"
when = "On approval"
rule = "Rule 4 / Rule 5"
source = "https://nbr.gov.bd/form/vat/vat-2012/eng"
as_of = "2026-09-06"
verified = true
note = "Published by NBR on its VAT-2012 forms index. It must be DISPLAYED at the place of business: failure to display carries a Tk 10,000 penalty under s.85(1)(খ)."

[[vat.mushak_forms]]
form = "2.4"
label_bn = "নিবন্ধন বা তালিকাভুক্তি বাতিলের আবেদন"
label_en = "Application for cancellation of registration or enlistment"
purpose = "Cancel a registration or enlistment on cessation"
filed_by = "The registered or enlisted person"
when = "On cessation of the economic activity"
rule = "Rule 8 (VAT); Rule 9 (turnover tax)"
source = "https://nbr.gov.bd/uploads/rules/VATR2016.pdf"
as_of = "2016-11-03"
verified = true
note = "Rule numbers read from the primary Rules gazette. Failure to apply for cancellation carries a Tk 10,000 penalty under s.85(1)(ঘ) — a dormant BIN is not a free BIN. BIN-closure notices may now be served through the eVAT system and the hearing attended virtually."

[[vat.mushak_forms]]
