# s.86 / s.87 — SALARY AND HONORARIUM
# =========================================================================================

  [tds.sections.86]
  section = "86"
  label_en = "Deduction of tax from employment income (salary)"
  label_bn = "বেতন হইতে উৎসে কর কর্তন"
  applies_to = "Any payment of income classifiable under 'Income from employment'."
  deducted_by = "The employer, at the time of payment. For Government salary bills, the Drawing and Disbursing Officer at the time of preparing or signing the bill (s.86(3))."
  condition = "s.86(5): the Deputy Commissioner of Taxes may certify no deduction or a reduced rate for the remainder of the income year."
  source = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
THERE IS NO FIXED SALARY TDS RATE. s.86(1) requires deduction at the AVERAGE RATE OF TAX
applicable to the recipient's ESTIMATED total income under 'Income from employment' for the
income year. That estimate must be recomputed as circumstances change: s.86(4) lets the
deduction be increased or decreased to adjust any excess or deficiency ARISING IN THE CURRENT
INCOME YEAR — not a prior year.

s.86(3): a Government DDO applies the same average-rate method to the estimated total salary
for the year where annual salary exceeds the tax-free limit.

The employer discharges its reporting through the s.145 / Schedule-1 certificate and the
QUARTERLY s.177 return. There is no standalone annual salary statement in the Income Tax Act
2023 equivalent to ITO 1984 ss.108/108A — see [tds.returns].
"""

    [tds.sections.86.method]
    label_en = "Salary TDS method — average rate on estimated total employment income"
    label_bn = "বেতনের উৎসে কর পদ্ধতি — প্রাক্কলিত মোট বেতন আয়ের উপর গড় হার"
    value = "average_rate_on_estimated_employment_income"
    unit = "policy"
    source = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
    as_of = "2026-07-01"
    verified = true
    placeholder = false
    note = """
Not a rate — a method. Compute the employee's estimated annual tax under the individual slabs
for this assessment year (see [income_tax.individual]), divide by estimated total employment
income to get the average rate, and apply that average rate to each payment. TakaBooks will
not emit a single "salary TDS percentage" because the Act does not provide one.
"""

