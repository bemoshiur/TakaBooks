  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
s.163(1)–(2), as REPLACED by the Finance Act 2026 s.91. The old broad minimum-tax character of
withholding is ABOLISHED. Excess withholding is refundable, or may be carried forward and
adjusted against a prior or subsequent year's liability. s.164 (excess or short withholding
not to be minimum tax) was REPEALED by s.92.

The marginal note of the new s.163 is "অগ্রিম কর, চূড়ান্ত কর এবং টার্নওভার ট্যাক্স" — advance
tax, final tax and turnover tax. THERE IS NO "MINIMUM TAX" LIMB.

⚠️ SEQUENCING TRAP: Act 89 of 2026 §94 (April 2026) had rewritten s.163 with a minimum-tax
list in its s.163(2). Act 96 of 2026 (the Finance Act 2026) §91 replaced s.163 AGAIN from
1 July 2026. Any source describing a s.163(2) minimum-tax list is reading the superseded April
text. Verify against the current consolidated text before treating any withholding as minimum
tax.
"""

