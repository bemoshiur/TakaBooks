# -----------------------------------------------------------------------------------------
# Turnover tax (the former corporate "minimum tax on gross receipts") — ITA 2023 s.163(6)
# -----------------------------------------------------------------------------------------
# ⚠️ STRUCTURAL CHANGE. The Finance Act 2026 WITHDREW the rule that treated tax deducted at
# source under ss.89–151 as a non-refundable minimum tax (ITA 2023 ss.163(1)-(2); s.164
# repealed). Withholding in excess of the assessed liability is now REFUNDABLE or may be carried
# forward. What survives under this heading is TURNOVER TAX on gross receipts, plus final tax on
# commercial motor vehicles (s.138) and inland water vessels (s.139) only. Excess turnover tax
