value = 525000
unit = "BDT"
condition = "Taxpayer is of the third gender / তৃতীয় লিঙ্গের করদাতা"
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
