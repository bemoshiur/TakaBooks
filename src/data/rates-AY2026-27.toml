# =========================================================================================
# SECTION — DEADLINES  ·  [deadlines]  ·  করবর্ষ / assessment year 2026-27
# Node contract: label_en, label_bn, value,
# unit, source, as_of, verified, placeholder, note — src/engine/rates.py parses these.
#
# WHY THE VALUES ARE PROSE, NOT DATES
#   Almost no Bangladeshi filing obligation is a single calendar date.  s.170 of the Income
#   Tax Act 2023 is a four-band window, not a due date; the VAT return is "within 15 days of
#   the end of every three tax periods"; the company income tax return is "the 15th day of
#   the ninth month".  A bare date would be a lie for most entities, so every value states
#   the rule exactly and, where a concrete AY 2026-27 date follows, gives it too.
#
# WHAT CHANGED FOR AY 2026-27 — read this before you copy this file forward
#   1. ITA 2023 s.170 was WHOLLY SUBSTITUTED by the Finance Act 2026 (Act 96 of 2026) s.97,
#      effective 1 July 2026.  The old "Tax Day + 2% per month" model is gone.
#   2. UNRESOLVED — the statutory "specified date" for an individual return.  This package's
#      research document (docs/research/bd-tax-research-2026-09-05.md §1.9, and its
#      compliance calendar) records ITA 2023 s.2(80A), inserted by Act 89 of 2026 §29(ট), as
#      IN FORCE and setting 30 NOVEMBER for individuals and Hindu Undivided Families.  A
#      later, uncited reading of the consolidated text on bdlaws was taken to show the same
#      clause (as s.2(80ka)) deleted by the Finance Act 2026.  That reading appears in no
#      permitted source and could not be confirmed; the research itself flags the whole area
#      as unresolved at §C10 ("I could not verify the drafting").  Do NOT tell a user that no
#      individual due date is in force.  See
#      deadlines.income_tax_return_specified_date_status, which is verified = false and
#      states both readings.
#   3. VAT Act 2012 s.64 was wholly substituted by Finance Act 2026 s.11, effective
#      1 July 2026: the VAT return is QUARTERLY, not monthly.
#
# HOW TO UPDATE AFTER THE NEXT FINANCE ACT
#   Open the section on bdlaws (the bdlaws URLs below are section-level and were not independently re-verified), read the
#   amendment footnotes at the foot of the page — they name the amending Act and its
#   effective date — then rewrite value, source, as_of and note together.  Never move
#   as_of forward without re-reading the section: a stale as_of on a changed figure is the
#   most dangerous state this file can be in.
# =========================================================================================

[deadlines]
note = """
Dates are prose so that "the 15th day of the ninth month" and "within 15 days of the end of
every three tax periods" can be stated exactly.  Every node below was read from the
consolidated Bangla statute on bdlaws.minlaw.gov.bd on 2026-09-06 unless its own note says
otherwise.  Where a boundary is an inference rather than an enacted date, the node says so
in its value as well as its note, because a reader diarising a date will not read footnotes.
"""

