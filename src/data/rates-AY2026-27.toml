s.55(a), which disallowed the expense on a TDS default, was DELETED by the Finance Act 2026
s.48(b). The old advice that "a TDS failure costs you twice — the tax and the deduction" is no
longer right. It now costs 150% of the tax, and the expense stands.
"""

