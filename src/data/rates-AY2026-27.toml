# -----------------------------------------------------------------------------------------
# EXEMPTIONS — অব্যাহতি
# -----------------------------------------------------------------------------------------
# Exemption comes from the FIRST SCHEDULE and from SROs made under s.126
# (http://bdlaws.minlaw.gov.bd/act-1106/section-42421.html). The FY2026-27 exemption SRO is
# SRO 127-AIN/2026/332-Musak dated 7 June 2026, which replaced SRO 160-AIN/2025/288-Musak of
# 27 May 2025 and was itself amended by SRO 255-Ain/2026/355-Mushak dated 30 June 2026 —
# and SRO 255 sits inside the post-budget range NBR has NOT uploaded, so the amended text
# could not be read. TakaBooks therefore holds no exemption list. Ask NBR or your VAT circle
# for the current consolidated exemption SRO before treating any supply as exempt.
#
# Remember an EXEMPT supply is not a zero-rated one: exempt means no output VAT AND no input
# credit (s.46(1)(jha)); zero-rated means no output VAT but the input credit survives.

  [vat.exemptions.registered_startup_supplies]
  label_en = "All supplies by a registered startup"
  label_bn = "নিবন্ধিত স্টার্টআপের সকল সরবরাহ"
  value = "exempt"
  unit = "policy"
  source = "https://www.pwc.com/bd/en/assets/pdfs/budget/finance-act-2026-key-amendments.pdf"
  as_of = "2026-06-30"
  verified = false
  placeholder = false
  note = """
All supplies by a registered startup are exempt from 1 July 2026, INCLUDING VAT on imported
services and VAT on rent, and the buyer is also relieved of deducting VDS (VDS Rules rule
5(ট)). NOT VERIFIED: rests on PwC Bangladesh, Finance Act 2026: Key Amendments, corroborated
by Tuhin & Partners; the granting instrument was not opened, and "registered startup" is a
defined status whose registration route the research did not establish. To confirm: obtain
the exemption SRO and the startup-registration criteria from NBR before invoicing without VAT.
"""

  [vat.exemptions.content_creator_freelancer_until]
  label_en = "End date of the content creator and freelancer VAT exemption"
  label_bn = "কনটেন্ট ক্রিয়েটর ও ফ্রিল্যান্সারের মূসক অব্যাহতির শেষ তারিখ"
  value = "2029-06-30"
  unit = "date"
  source = "https://www.pwc.com/bd/en/assets/pdfs/budget/finance-act-2026-key-amendments.pdf"
  as_of = "2026-06-30"
  verified = false
  placeholder = false
  note = """
Content creators and freelancers are exempt under an SRO running to 30 June 2029. NOT
VERIFIED: rests on PwC Bangladesh, Finance Act 2026: Key Amendments, corroborated by Tuhin &
Partners; the SRO itself was not opened and its number was not recorded. To confirm: obtain
the SRO from NBR. Note the tension with vat.rates.reduced.it_enabled_services — ITES at
S099.10 is a 5% CHARGE, so which of the two a given engagement falls under matters.
"""

# =========================================================================================
# THE MUSHAK FORM SERIES — মূসক ফরম
# =========================================================================================
# Catalogue entries, NOT rate nodes: they carry no `value` key, so rates.py treats this block
# as metadata and vat.py never reads a rate from it. Every rate node in this file keeps
# exactly the nine contract fields; these entries carry the form's own descriptive fields.
#
# Rule numbers come from the primary Rules gazette — SRO No. 333-Ain/2016/1-Mushak dated
# 3 November 2016, made under s.135 of the Act: https://nbr.gov.bd/uploads/rules/VATR2016.pdf
# ⚠️ The commonly cited "SRO 186-Ain/2016" for the VAT Rules is a WRONG citation.
#
# ⚠️ RULE NUMBERS FOR MUSHAK 4.3, 4.3.1, 6.2.1 AND 9.1.1 ARE NOT ESTABLISHED. The NBR-hosted
#    Rules PDF is the ORIGINAL 3 November 2016 gazette and does not contain Mushak 4.3 or
#    6.2.1 at all — both were added by later amending SROs that could not be located. Rule
#    numbers for the two new FY2026-27 forms (4.3.1 and 9.1.1) are simply unknown. Those four
#    entries carry rule = "" and verified = false. TakaBooks does not guess a rule number.
#
# ⚠️ Bangla form names are renderings from decoded rule headings and the ICAB manual. Check
#    them against the form schedule in the amended Rules before quoting one to NBR.
#
# `source` is NBR's own VAT-2012 forms index (https://nbr.gov.bd/form/vat/vat-2012/eng, read
# 6 September 2026) for the eleven forms NBR actually publishes there — 2.1, 2.3, 4.3, 6.1,
# 6.2, 6.2.1, 6.3, 6.5, 6.10, 9.1 and 9.2 — and the Rules gazette for the rest.

[[vat.mushak_forms]]
form = "2.1"
label_bn = "নিবন্ধন/তালিকাভুক্তির আবেদনপত্র"
label_en = "Application for VAT registration or turnover tax enlistment"
purpose = "Obtain a BIN, or enlistment for turnover tax"
filed_by = "The registrable or enlistable person"
when = "Registration: on becoming registrable. Enlistment: within 30 days of crossing the threshold (s.10(1))"
rule = "Rule 4 (registration); Rule 5 (enlistment)"
source = "https://nbr.gov.bd/form/vat/vat-2012/eng"
as_of = "2026-09-06"
verified = true
note = "Published by NBR on its VAT-2012 forms index. From FY2026-27 the application and its approval are fully automated in the e-VAT system: BIN is issued immediately on submission of valid information, to the registered email address, with physical inspection following approval rather than preceding it."

[[vat.mushak_forms]]
form = "2.2"
label_bn = "অনাবাসিক ব্যক্তির নিবন্ধন"
