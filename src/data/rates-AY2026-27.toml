"""

# =========================================================================================
# VDS — উৎসে মূসক কর্তন (VAT deducted at source)
# =========================================================================================
# Journal tag grammar: VDS:<rate>. vat.py reads one rate per child table of [vds.services].
#
# INSTRUMENTS:
#   উৎসে মূল্য সংযোজন কর কর্তন ও আদায় বিধিমালা, ২০২৫
#     = এস.আর.ও. নং ১৮২-আইন/২০২৫/৩১০-মূসক, 13 Jyaistha 1432 / 27 May 2025.
#       Commenced 1 July 2025; repealed the 2021 Rules (rule 10).
#   as amended by এস.আর.ও. নং ১৪০-আইন/২০২৬/৩৪৫-মূসক, 24 Jyaistha 1433 / 7 June 2026.
#       Commences 1 July 2026. Its only Rule 3(1) table change is INSERTING S083.00 and
#       renumbering the old serials 41–44 to 42–45.
#   Both are made under ss.135, 49 and 127খ of the VAT and Supplementary Duty Act 2012.
#
# ⚠️ "SRO 258-Law/2026/358-VAT" DOES NOT EXIST. NBR's VAT-SRO index tops out at SRO 148 of
#   11 June 2026 and every probe of the 149–266 range returns 404. The real FY2026-27 VDS
#   amendment is SRO 140. Reject any chart citing SRO 258.
#
# ⚠️ NBR'S OWN VAT FAQ PAGE IS YEARS OUT OF DATE AND MUST NEVER BE CITED. It still publishes
#   pre-2019 thresholds, a 3% turnover tax and monthly returns by the 15th.
#
# STRUCTURAL POINT: the SRO has ONE rate column — মূসক উৎসে কর্তনের হার. There is NO separate
# "VAT rate" column. Charts printing paired VAT/VDS columns are reconstructing, not quoting.
# Deduction is mandatory on a supply under a tender, contract or work order
# "মূসক চালানপত্র থাকুক বা না থাকুক" — WHETHER OR NOT A MUSHAK 6.3 EXISTS.

[vds]
tag_grammar = "VDS:<rate>"
note = """
[vds.services] holds the Rule 3(1) table exactly as gazetted — 45 serials, some of which
produce more than one rate and therefore more than one node. Rates that arise elsewhere in the
Rules (imported services under Rule 3(2), issuing-authority fees under Rule 3(4), premises rent
under Rule 3(5)) live in [vds.other_charges] so that [vds.services] stays a faithful copy of
the gazetted table. All of them are 15%, which [vds.services] already declares, so a VDS:15
journal tag validates either way.

WHO MUST DEDUCT — the withholding entity (উৎসে মূসক কর্তনকারী সত্তা), VAT Act s.2(21):
  (a) any government entity;
  (b) any NGO approved by the NGO Affairs Bureau or the Department of Social Services;
  (c) any bank, insurance company or similar financial institution;
  (d) any secondary or higher-level educational institution;
  (e) any limited company;
  (f) any person or entity with annual turnover exceeding Tk 10 crore — inserted by the
      Finance Act 2024 (Act 5 of 2024) s.4(a), effective 1 July 2024.
Clause (e) catches EVERY limited company regardless of size. Clause (f) catches large
unincorporated businesses. See [vds.thresholds.withholding_entity_turnover].

LEGAL FRAMEWORK: s.49 (deduction at source and the withholder's increasing adjustment);
s.50 (the supplier's decreasing adjustment); s.53 (the VDS certificate, Mushak 6.6).
"""

  [vds.instrument.rules]
  label_en = "VAT Deduction at Source Rules 2025"
  label_bn = "উৎসে মূল্য সংযোজন কর কর্তন ও আদায় বিধিমালা, ২০২৫"
  citation = "এস.আর.ও. নং ১৮২-আইন/২০২৫/৩১০-মূসক"
  gazetted = "2025-05-27"
  effective = "2025-07-01"
  made_under = "VAT and Supplementary Duty Act 2012, ss.135, 49 and 127খ"
  source = "https://nbr.gov.bd/uploads/sros/VATSRO-1822.pdf"
  note = "Repealed the 2021 Rules by rule 10. NBR index date 2 June 2025."

  [vds.instrument.amendment]
  label_en = "SRO 140 of 2026 — amends the VAT Deduction at Source Rules 2025"
  label_bn = "এস.আর.ও. নং ১৪০-আইন/২০২৬/৩৪৫-মূসক"
  citation = "এস.আর.ও. নং ১৪০-আইন/২০২৬/৩৪৫-মূসক"
  gazetted = "2026-06-07"
  effective = "2026-07-01"
  source = "https://nbr.gov.bd/uploads/sros/VAT_SRO-140.pdf"
  note = """
NBR index date 11 June 2026. Its changes to the Rule 3(1) table are exactly two: it INSERTS
S083.00 (semiconductor assembly, testing and packaging) as serial 41 at 15%, and renumbers the
old serials 41–44 to 42–45. It also adds the rule 4(2) carve-out for a trader supplying goods
through a Mushak 6.3 having paid 15% VAT, and the rule 5(ট) exclusion for a registered startup.
"""

  [vds.thresholds.withholding_entity_turnover]
  label_en = "Annual turnover above which any person or entity becomes a VAT withholding entity"
  label_bn = "যে বার্ষিক টার্নওভারের ঊর্ধ্বে যে-কোনো ব্যক্তি বা সত্তা উৎসে মূসক কর্তনকারী সত্তা হয়"
  value = 100000000
  unit = "BDT"
  source = "http://bdlaws.minlaw.gov.bd/act-1106/section-42295.html"
  as_of = "2024-07-01"
  verified = true
  placeholder = false
  note = """
VAT Act s.2(21)(f), read from the statute text on bdlaws. Tk 10,00,00,000 = Tk 10 crore.
Inserted by the Finance Act 2024 (Act 5 of 2024) s.4(a), effective 1 July 2024. Note that a
LIMITED COMPANY is a withholding entity under clause (e) at ANY turnover — this threshold only
matters for persons and entities that are not otherwise listed.
"""

