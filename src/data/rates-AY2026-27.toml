# -----------------------------------------------------------------------------------------
# Investment rebate / বিনিয়োগজনিত কর রেয়াত — ITA 2023 s.78, REDUCED by the Finance Act 2026
# -----------------------------------------------------------------------------------------
# tax.py computes:
#     eligible = min(investment claimed, taxable_income x income_cap_percent, absolute_cap)
#     rebate   = eligible x rate           (then capped at the gross tax — a rebate can
#                                           never turn a liability negative)
#
# ⚠️ READ THIS BEFORE CHANGING ANY OF THE THREE NUMBERS BELOW.
# The STATUTORY rule for AY 2026-27 is expressed the other way round:
#     rebate = the LOWEST of  (a) 3% of total taxable income
#                             (b) 10% of the eligible investment actually made
#                             (c) Tk 750,000
# TakaBooks' `min_of_three_caps` construction caps the INVESTMENT and then applies one rate.
# The two are algebraically identical once the caps are restated in investment terms, because
# `rate` factors out of every limb:
#     rate = 10  and  income_cap_percent = 30   →  10% x 30% of income = 3% of income   = limb (a)
#     rate = 10  and  absolute_cap = 7,500,000  →  10% x 7,500,000     = Tk 750,000     = limb (c)
# So "eligible investment is capped at 30% of taxable income and at Tk 7,500,000" is a true
# statement of the law, not an invented figure — investing beyond either point buys no more
# rebate. But the numbers a taxpayer will see quoted in NBR and firm literature are 3%, 10%
# and Tk 750,000. Quote those to the user; the 30% and 7,500,000 are engine parameters.
# Worked check: income 10,000,000, investment 2,000,000 →
#   statutory min(300,000 ; 200,000 ; 750,000) = 200,000
#   engine   10% x min(2,000,000 ; 3,000,000 ; 7,500,000) = 200,000  ✔

[income_tax.individual.rebate]
formula = "min_of_three_caps"       # allowed: "min_of_three_caps"
formula_note = """
"min_of_three_caps": eligible investment is the least of (a) the amount actually invested,
(b) income_cap_percent of taxable income, (c) absolute_cap. Rebate = rate x eligible.
The statutory limbs it restates are 3% of total taxable income / 10% of eligible investment /
Tk 750,000 maximum rebate — see the block comment above.
"""
statutory_formulation_en = "Rebate = lowest of (a) 3% of total taxable income, (b) 10% of eligible investment, (c) Tk 750,000"
statutory_formulation_bn = "রেয়াত = নিম্নের মধ্যে সর্বনিম্ন: (ক) মোট করযোগ্য আয়ের ৩%, (খ) বিনিয়োগের ১০%, (গ) ৭,৫০,০০০ টাকা"

  [income_tax.individual.rebate.rate]
  label_en = "Rebate rate — 10% of the eligible investment (statutory limb (b))"
  label_bn = "রেয়াতের হার — বিনিয়োগের ১০% (আইনগত শর্ত (খ))"
  value = 10
  unit = "percent"
  source = "https://assets.kpmg.com/content/dam/kpmg/bd/pdf/Tax/Bangladesh_Tax_2026.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
10% of the eligible investment, REDUCED by the Finance Act 2026 from 15%. Stated by KPMG /
Rahman Rahman Huq, Bangladesh Tax 2026 p.47, by PwC Bangladesh Finance Act 2026: Key
Amendments p.6, and by Tuhin & Partners p.12 — three post-enactment summaries that agree.
NOT VERIFIED against enacted text: the Finance Act 2026 gazette PDF is in a legacy Bijoy Bangla
font that could not be extracted, and NBR's আয়কর পরিপত্র ২০২৬-২০২৭ rate excerpt covers the rate
schedules only, not s.78. Confirm against ITA 2023 s.78 on bdlaws.minlaw.gov.bd
(http://bdlaws.minlaw.gov.bd/act-details-1429.html) as amended by the Finance Act 2026 before
relying on it. Practical effect of the cut: a taxpayer must now invest roughly 50% more to
obtain the same rebate.
"""

  [income_tax.individual.rebate.income_cap_percent]
  label_en = "DERIVED ENGINE PARAMETER — eligible investment capped at 30% of taxable income, which restates the statutory 3%-of-income limb at a 10% rebate rate. Quote 3% of income to a taxpayer, not 30%."
  label_bn = "উদ্ভূত ইঞ্জিন প্যারামিটার — করযোগ্য আয়ের ৩০% পর্যন্ত বিনিয়োগ গ্রহণযোগ্য, যা ১০% রেয়াত হারে আইনের 'আয়ের ৩%' শর্তেরই রূপান্তর। করদাতাকে ৩০% নয়, আয়ের ৩% বলুন।"
  value = 30
  unit = "percent"
  source = "https://assets.kpmg.com/content/dam/kpmg/bd/pdf/Tax/Bangladesh_Tax_2026.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
ENGINE PARAMETER, not a figure printed in the law. The statute caps the rebate at 3% of total
taxable income; at a 10% rebate rate that is the same as capping the eligible investment at 30%
of taxable income (10% x 30% = 3%). Quote "3% of total taxable income" to a user, not "30%".
Source for the underlying 3% limb: KPMG p.47 (also PwC p.6, TNP p.12). Unverified for the same
reason as the rebate rate.
ALSO NOTE A MODELLING LIMIT: the statutory 3% is computed on total taxable income EXCLUDING
income that is exempt, taxed at a reduced rate, or taxed as final tax, and excluding a share of
income from a firm or association of persons. tax.py applies income_cap_percent to whatever
taxable income the caller supplies. A taxpayer with any such income must reduce the income
figure before running the calculation, or the cap will be computed too high.
"""

  [income_tax.individual.rebate.absolute_cap]
  label_en = "DERIVED ENGINE PARAMETER — eligible investment capped at Tk 7,500,000, which restates the statutory Tk 750,000 MAXIMUM REBATE at a 10% rebate rate. The figure in the law is Tk 750,000; do not quote Tk 7,500,000 to a taxpayer."
  label_bn = "উদ্ভূত ইঞ্জিন প্যারামিটার — ৭৫,০০,০০০ টাকা পর্যন্ত বিনিয়োগ গ্রহণযোগ্য, যা ১০% রেয়াত হারে আইনের সর্বোচ্চ ৭,৫০,০০০ টাকা রেয়াতেরই রূপান্তর। আইনের সংখ্যা ৭,৫০,০০০ টাকা।"
  value = 7500000
  unit = "BDT"
  source = "https://assets.kpmg.com/content/dam/kpmg/bd/pdf/Tax/Bangladesh_Tax_2026.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
ENGINE PARAMETER, not a figure printed in the law. ⚠️ DO NOT QUOTE Tk 7,500,000 TO A TAXPAYER.
The statute caps the REBATE ITSELF at Tk 750,000 (reduced by the Finance Act 2026 from
Tk 1,000,000). At a 10% rebate rate that is the same as capping the eligible INVESTMENT at
Tk 7,500,000, which is the number this schema slot needs. Source for the underlying Tk 750,000
ceiling: KPMG p.47, PwC p.6, TNP p.12. Unverified for the same reason as the rebate rate.
Top-bracket taxpayers lose up to Tk 250,000 of maximum rebate compared with AY 2025-26.
"""

