short-deducted, short-collected or short-paid PLUS A FURTHER 50% OF IT is payable — i.e. 150%
of the tax defaulted. s.56(1)(b): if the tax paid via s.143 proceedings is less than that, the
shortfall plus 50% of it is payable.

NBR's own worked example in the Paripatra 2026-27 confirms the arithmetic: applicable TDS
Tk 400,000, deducted Tk 200,000, shortfall Tk 200,000, payable = 200,000 + (200,000 × 50%)
= Tk 300,000.

