  value = "July to May: within 2 weeks from the end of the month of deduction or collection. 1st to 20th day of June: within 7 days following the day of deduction or collection. Any other day of June: the next day. The LAST WORKING DAY of June: the same day."
  unit = "date"
  source = "https://nbr.gov.bd/uploads/rules/With_holding_2026.pdf"
  as_of = "2026-07-05"
  verified = true
  placeholder = false
  note = """
Rule 9 of SRO 273, all four rows (ক, খ, গ, ঘ), read from the gazette.

⚠️ ROW ঘ TURNS ON THE LAST *WORKING* DAY OF JUNE, NOT ON 30 JUNE. The Bangla is
"অর্থবৎসরের জুন মাসের শেষ কর্মদিবসে কর কর্তন বা সংগ্রহের ক্ষেত্রে" → deposit on
"কর্তন বা সংগ্রহের দিন". This matters whenever 30 June falls on a weekend or a public
holiday: the same-day rule attaches to the last WORKING day, which may be 28 or 29 June.
KPMG's published summary renders rows গ and ঘ as "21–29 June / 30 June", which is a
SIMPLIFICATION of the actual rule and will mislead you in a year where 30 June is a Friday or
a Saturday.

Deposit is by A-CHALLAN only. s.146(1) requires deposit within the prescribed time or as the
Board directs; s.146(2) forbids withholding tax otherwise than under the Act — you may not
"hold" a deduction pending a dispute.
"""

