# -----------------------------------------------------------------------------------------
# Progressive slabs / করহার ধাপ
# -----------------------------------------------------------------------------------------
# An ORDERED list. Each slab consumes `width` taka of taxable income at `rate` percent.
#   * slab 1 sets width_source = "category_threshold": its width IS the selected category's
#     tax-free threshold, so one slab table serves every category.
#   * every middle slab carries its own `width` rate node (unit = "BDT").
#   * the LAST slab omits both `width` and `width_source`: it is open-ended and takes all
#     remaining income. Exactly one open-ended slab is allowed and it must be last.
# tax.py validates that shape and refuses to guess if it is violated.

[[income_tax.individual.slabs]]
