[income_tax.corporate]
note = """
`conditions` carries anything that changes the headline rate (listing status, transaction
routing requirements, sector carve-outs). It is prose; do not encode it as a number until a
module needs to compute with it.

WHERE A REDUCED "BANK TRANSFER" RATE EXISTS it is a SEPARATE KEY ending
`_bank_transfer_compliant`, so that both figures carry their own provenance rather than one node
carrying a second number in its prose. The condition itself is at
[income_tax.corporate.bank_transfer_condition] and is NOT confirmed — read it before quoting a
reduced rate to anyone.
"""

# -----------------------------------------------------------------------------------------
# The banking-channel ("cashless") condition — THE MOST COMMERCIALLY MATERIAL OPEN QUESTION
# -----------------------------------------------------------------------------------------
  [income_tax.corporate.bank_transfer_condition]
  label_en = "Condition for the reduced corporate rate — banking-channel compliance"
  label_bn = "হ্রাসকৃত কর্পোরেট করহারের শর্ত — ব্যাংকিং চ্যানেলে লেনদেন"
  value = "all_transactions_through_bank_transfer"
  unit = "policy"
  allowed = ["all_transactions_through_bank_transfer", "de_minimis_500000_single_3600000_annual"]
  applies_to = "Categories 1 to 3 only: publicly traded companies (both variants) and non-publicly traded general companies. It is NOT available to banks, insurers, finance companies, tobacco manufacturers or mobile phone operators, whose tables say শর্ত প্রযোজ্য নয় (condition not applicable)."
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
⚠️ THIS DECIDES A 2.5-PERCENTAGE-POINT RATE DIFFERENCE AND IS NOT CONFIRMED. Read this before
quoting any `_bank_transfer_compliant` rate.

WHAT IS KNOWN. NBR Paripatra 2026-27 §1.5 states the condition, under the rate table, as:
"শর্ত: বিবেচ্য আয়বর্ষে সকল ধরনের লেনদেন ব্যাংক ট্রান্সফারের মাধ্যমে সম্পন্ন করতে হবে" — in the
income year concerned, ALL kinds of transactions must be completed through bank transfer. It
states NO de-minimis. PwC Worldwide Tax Summaries (reviewed 31 July 2026,
https://taxsummaries.pwc.com/bangladesh/corporate/taxes-on-corporate-income) states two
conditions with no threshold: all transactions to be undertaken through bank transfer, and all
income received through bank transfer. KPMG p.19 records the move to "all transactions" as the
change the Finance Act 2026 made, and confirms both listed and non-listed general companies may
take the benefit.

WHAT IS NOT KNOWN. Under the pre-Finance-Act-2026 rule the requirement was qualified: only a
single transaction above Tk 500,000, or an annual aggregate above Tk 3,600,000, had to go
through banking channels. Secondary commentary still repeats those figures for FY2026-27. The
enacted Schedule 2 condition COULD NOT BE READ, because the Finance Act 2026 gazette PDF is in a
legacy Bijoy Bangla font that does not extract, and a one-line Paripatra summary is not the
enacted text. So this node is verified = false.

HOW TO TREAT IT. Assume the unqualified 100% requirement, which is the conservative reading — a
SINGLE non-compliant cash transaction forfeits the reduced rate for the whole income year (TNP
p.24). Do not rely on a de-minimis without reading Schedule 2 of the Finance Act 2026 first.
"""

