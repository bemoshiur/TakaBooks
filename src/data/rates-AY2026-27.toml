  value = "One AGM in every English calendar year, with not more than 15 months between one AGM and the next. First AGM: within 18 months of incorporation. The Registrar may, on application made within 30 days of the period expiring, extend a subsequent (never the first) AGM by not more than 90 days or to 31 December of the calendar year it relates to, whichever comes first."
  unit = "date"
  source = "http://bdlaws.minlaw.gov.bd/act-788/section-32905.html"
  as_of = "1994-09-12"
  verified = true
  placeholder = false
  note = """
Read from Companies Act 1994 s.81(1) and its two provisos in the Bangla primary text on
bdlaws.  Three separate limits bind at once — the calendar year, the 15-month gap, and (via
s.183(2)) the 9-month staleness rule on the accounts laid — so a company can satisfy one and
still breach another.  Failure to hold an AGM is penalised by s.82; the amounts are in
src/references/penalties.md.
"""

  [deadlines.rjsc_accounts_period_before_agm]
  label_en = "Age of the accounts laid before the AGM"
  label_bn = "বার্ষিক সাধারণ সভায় উপস্থাপিত হিসাবের সময়কাল"
  value = "The accounts laid must be made up to a date falling within 9 months before the meeting — 12 months where the company carries on business or has interests outside Bangladesh. The Registrar may extend by up to 3 months on application made before the period expires. The financial year itself may not exceed 15 months (18 with the Registrar's special permission)."
  unit = "date"
  source = "http://bdlaws.minlaw.gov.bd/act-788/section-33572.html"
  as_of = "1994-09-12"
  verified = true
  placeholder = false
  note = """
Read from Companies Act 1994 s.183(2), s.183(4) and their provisos.  s.183(3) requires the
balance sheet and profit and loss account to be audited by the company's auditor, with the
report attached or referred to at the foot and read at the meeting.  s.183(6) requires a copy
to be open at the registered office for at least 14 days before the meeting, and s.191
requires a free copy to every member not less than 14 days before it.
"""

  [deadlines.rjsc_annual_return_schedule_x]
  label_en = "Annual return to RJSC — list of members and summary of share capital"
  label_bn = "আরজেএসসিতে বার্ষিক রিটার্ন — সদস্যগণের তালিকা ও সার-সংক্ষেপ (তফসিল ১০)"
  value = "The Schedule X list and summary must be completed within 21 days after the first or only general meeting of the year, and the signed copy filed with the Registrar FORTHWITH (অবিলম্বে) thereafter — the Act sets no separate filing period beyond the same 21 days. A company with share capital files within 18 months of incorporation and at least once every year thereafter."
  unit = "date"
  source = "http://bdlaws.minlaw.gov.bd/act-788/section-32860.html"
  as_of = "1994-09-12"
  verified = true
  placeholder = false
  note = """
Read from Companies Act 1994 s.36(1) and s.36(3) in the Bangla primary text.  s.36(3) says
the list must be completed "একুশ দিনের মধ্যে" after the meeting and filed "অবিলম্বে ... উক্ত একই
সময়ের মধ্যে" — forthwith, within that same period — so treat 21 days after the AGM as the
filing date, not merely the preparation date.  Signature: two directors including the
managing director (or one director where there is no MD), plus the managing agent, manager
or secretary, with their certificate that the facts are correctly stated.  A private company
also files the s.36(4) certificate that no public invitation to subscribe has been issued.
Continuing default is penalised daily under s.36(5).
"""

  [deadlines.rjsc_balance_sheet_filing]
  label_en = "Audited balance sheet and profit and loss account to RJSC"
  label_bn = "নিরীক্ষিত ব্যালান্স শীট ও লাভ-ক্ষতির হিসাব আরজেএসসিতে দাখিল"
  value = "Within 30 days from the date the balance sheet and profit and loss (or income and expenditure) account are laid before the AGM; or, where no AGM was held that year, within 30 days from the last date on which the AGM should have been held. Three copies, with everything the Act requires to be annexed."
  unit = "date"
  source = "http://bdlaws.minlaw.gov.bd/act-788/section-33579.html"
  as_of = "1994-09-12"
  verified = true
  placeholder = false
  note = """
Read from Companies Act 1994 s.190(1) in the Bangla primary text ("ত্রিশদিনের মধ্যে ... তিনটি
করিয়া অনুলিপি").  Note the second limb: skipping the AGM does not postpone this filing, it
starts the clock from the date the AGM was due.  A private company files the balance sheet
and the profit and loss account separately (first proviso).  Where the balance sheet was not
adopted, or no AGM was held, s.190(2) requires a statement of that fact and the reasons to be
