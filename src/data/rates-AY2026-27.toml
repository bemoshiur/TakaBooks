value = 550000
unit = "BDT"
condition = "Gazetted person injured in the July 2024 mass uprising / জুলাই গণঅভ্যুত্থান ২০২৪-এ আহত গেজেটভুক্ত জুলাই যোদ্ধা"
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-07-01"
verified = true
placeholder = false
note = """
Tk 5,50,000. NEW CATEGORY. Paripatra 2026-27 §1.1, item 3 reads: "গেজেটভুক্ত যুদ্ধাহত
মুক্তিযোদ্ধা ও জুলাই গণঅভ্যুত্থান ২০২৪ এ আহত গেজেটভুক্ত 'জুলাই যোদ্ধা' করদাতার ক্ষেত্রে
