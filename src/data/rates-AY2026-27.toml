# -----------------------------------------------------------------------------------------
# Minimum tax / ন্যূনতম কর
# -----------------------------------------------------------------------------------------
# ⚠️ THE LOCATION BASIS IS ABOLISHED FROM AY 2026-27. The old scale — Tk 5,000 in the Dhaka and
# Chattogram city corporations, Tk 4,000 in other city corporations, Tk 3,000 elsewhere — NO
# LONGER EXISTS. Most online guides have not caught up. The four old tier keys
# (city_corporation_tier_1, city_corporation_tier_2, other_city_area, other_area) have been
# DELETED from this file rather than given equal values, so that nothing suggests the
# distinction survives; `--location other_area` will now fail with a list of the real tiers.
#
# The `by_location` table is retained because tax.py selects the flat floor through it. For
# AY 2026-27 it holds two entries which are really taxpayer STATUS, not geography.

[income_tax.individual.minimum_tax]
note = """
Two independent floors: a flat amount (no longer location-dependent — see above) and a
percentage of gross receipts for taxpayers with business turnover. tax.py takes the greater of
the two applicable floors and then the greater of (tax after rebate, that floor).

NBR Paripatra 2026-27 §1.1 is explicit that the flat floor bites even where the rebate wipes
the liability out: "করমুক্ত সীমার ঊর্ধ্বে আয় রয়েছে এমন করদাতার প্রদেয় আয়করের পরিমাণ বা
বিনিয়োগজনিত কর রেয়াত বিবেচনার পর প্রদেয় আয়করের পরিমাণ ন্যূনতম আয়করের চেয়ে কম, শূন্য বা
ঋণাত্মক হলেও তাকে প্রযোজ্য ন্যূনতম আয়কর পরিশোধ করতে হবে."
"""

  [income_tax.individual.minimum_tax.applies_when]
  value = "taxable_income_above_threshold"
  unit = "policy"
  allowed = ["always", "taxable_income_above_threshold", "never"]
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
Policy switch, NOT a rate. The floor bites only where total income EXCEEDS the applicable
tax-free threshold. NBR Paripatra 2026-27 §1.1: "মোট আয় করমুক্ত আয়ের সীমা অতিক্রম করিলে ন্যূনতম
করের পরিমাণ হবে ৫,০০০ (পাঁচ হাজার) টাকা" — read literally, the floor is triggered by crossing
the threshold, which is what "taxable_income_above_threshold" means to tax.py.
"""

# The KEY is the tier id `tax.py --location` accepts.
  [income_tax.individual.minimum_tax.by_location.all_areas]
  label_en = "Any area of Bangladesh (the location split is abolished)"
  label_bn = "বাংলাদেশের যেকোনো এলাকা (এলাকাভিত্তিক বিভাজন বিলুপ্ত)"
  covers = "Every area of Bangladesh — city corporation, paurashava, cantonment board or rural. There is no longer any geographic distinction."
  value = 5000
  unit = "BDT"
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
Tk 5,000 flat, irrespective of location, for any taxpayer whose total income exceeds the
tax-free threshold. NBR Paripatra 2026-27 §1.1. ⚠️ This REPLACES the AY 2025-26 scale of
Tk 5,000 / Tk 4,000 / Tk 3,000 by area, which is abolished. Charts still showing that scale for
AY 2026-27 are wrong.
"""

  [income_tax.individual.minimum_tax.by_location.new_taxpayer]
  label_en = "New / first-time taxpayer (any area)"
  label_bn = "নতুন করদাতা (যেকোনো এলাকা)"
  covers = "A taxpayer filing for the first time. Not a geographic tier — it is selected through --location because that is the selector tax.py exposes for the flat floor."
  value = 1000
  unit = "BDT"
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
Tk 1,000 for new taxpayers: "তবে, নতুন করদাতাগণের ক্ষেত্রে এরূপ ন্যূনতম করের পরিমাণ হবে ১,০০০
(এক হাজার) টাকা" — NBR Paripatra 2026-27 §1.1. The Paripatra does not define how long a taxpayer
counts as "new"; NBR practice is the first assessment year in which the person files, but THAT
IS NOT SOURCED HERE. Confirm with the tax circle for a second-year filer.
"""

# Minimum tax as a percentage of gross receipts — from AY 2026-27 this is TURNOVER TAX under
# ITA 2023 s.163(6), not "minimum tax". tax.py applies it only when the user supplies
# --gross-receipts AND those receipts exceed `applies_above`. Without --gross-receipts this
# floor is reported as "not applicable".

  [income_tax.individual.minimum_tax.on_gross_receipts.rate]
  value = 1
  unit = "percent"
  source = "https://tnp.legal/wp-content/uploads/2026/07/TNP_Finance_Act_2026_Briefing.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
1% of gross receipts — the residual "all other cases" turnover tax rate under ITA 2023 s.163(6).
SINGLE SOURCE: Tuhin & Partners, The Finance Act 2026: A Practitioner's Guide p.17. Not
corroborated by PwC or KPMG, and not read from enacted text. It DOES vary by sector: tobacco 3%,
carbonated and sweetened beverages 2.5%, mobile phone and NTTN operators 1.5%, a new industrial
undertaking 0.2% in its first three income years, registered startups 0%. Those sector rates are
recorded under income_tax.corporate.minimum_tax.by_sector and are not applied by tax.py.
Turnover tax does NOT apply at all to commission business, delivery order business, money
exchange business, or trading in gold, silver, ornaments, gems, diamonds or platinum.
"""

  [income_tax.individual.minimum_tax.on_gross_receipts.applies_above]
  value = 0
  unit = "BDT"
  source = "https://tnp.legal/wp-content/uploads/2026/07/TNP_Finance_Act_2026_Briefing.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = true
  note = """
STILL A PLACEHOLDER, DELIBERATELY. The gross-receipts threshold at which turnover tax engages
for an individual under ITA 2023 s.163(6) COULD NOT BE SOURCED. The research establishes only
that a threshold exists — Tuhin & Partners p.17 says trusts, firms and associations of persons
are liable "irrespective of the gross-receipts threshold", which implies one applies to everyone
else — without stating its amount. Because this node is a placeholder, tax.py REFUSES to compute
the turnover-tax floor at all when --gross-receipts is supplied, instead of guessing a threshold.
That refusal is the correct behaviour: absent beats wrong. To land it, read ITA 2023 s.163(6) as
amended by the Finance Act 2026 at http://bdlaws.minlaw.gov.bd/act-details-1429.html.
"""

# -----------------------------------------------------------------------------------------
# Surcharge / সারচার্জ — TWO SEPARATE LEVIES from the Finance Act 2026
# -----------------------------------------------------------------------------------------
# The Finance Act 2026 split the single old concept in two (ITA 2023 ss.2(14), 2(21), 2(86Kha)):
#   (a) the WEALTH surcharge, banded on net assets, immediately below; and
#   (b) the ENVIRONMENTAL surcharge, a flat taka amount per motor car in excess of one, in
#       [income_tax.individual.environmental_surcharge]. It is a separate charge, NOT a band of
#       the wealth surcharge, and it is due even where the wealth surcharge is nil.
# There are also two 2.5% additions on particular kinds of income — see
# [income_tax.individual.additional_surcharge].
#
# tax.py picks the LAST band whose `wealth_above` is <= the taxpayer's net wealth, then applies
# that band's percentage to the base named in `base`.

[income_tax.individual.surcharge]
wealth_basis = "net_wealth"      # descriptive: what the bands are measured against
net_wealth_definition_en = "Total acquisition value of the net assets shown in the statement of assets and liabilities under ITA 2023 s.167"
net_wealth_definition_bn = "আয়কর আইন, ২০২৩ এর ধারা ১৬৭ অনুযায়ী পরিসম্পদ ও দায়ের বিবরণীতে প্রদর্শনযোগ্য নিট পরিসম্পদের মোট অর্জনমূল্য"
note = """
Band 1 carries no `wealth_above` node: it starts at zero. Every later band declares the net
wealth it starts above, exclusive. Bands must be listed in ascending order of wealth_above.

⚠️ THE 10% BAND HAS THREE ALTERNATIVE TRIGGERS AND tax.py MODELS ONLY ONE OF THEM. Per NBR
Paripatra 2026-27 §1.6(খ), 10% is due if ANY of these is true: net assets exceed Tk 4 crore but
not Tk 10 crore; OR the taxpayer owns more than one motor car in their own name; OR the taxpayer
owns house property exceeding 8,000 square feet in aggregate within a city corporation area.
tax.py tests NET WEALTH ONLY. A taxpayer with modest net assets but two cars, or a large flat,
still owes 10% and TakaBooks will not detect it. Ask the user about cars and floor area.
"Motor car" for this purpose EXCLUDES bus, minibus, coaster, prime mover, truck, lorry, tank
lorry, dump truck, covered van, cargo van, pickup van, human hauler, tractor, maxi or auto
rickshaw, crane, excavator, bulldozer, roller, concrete mixer, heavy motor vehicle, taxicab and
motorcycle (Paripatra 2026-27 §1.6 explanation (2)).
"""

  [income_tax.individual.surcharge.base]
  label_en = "Surcharge base. NBR Paripatra 2026-27 charges surcharge on tax computed on TAXABLE INCOME — that is, before the investment rebate — so the base is tax_before_rebate."
  label_bn = "সারচার্জের ভিত্তি। পরিপত্র ২০২৬-২৭ অনুযায়ী সারচার্জ করযোগ্য আয়ের উপর পরিগণিত করের উপর, অর্থাৎ বিনিয়োগ রেয়াতের পূর্বের করের উপর প্রযোজ্য।"
  value = "tax_before_rebate"
  unit = "policy"
  allowed = ["tax_before_rebate", "tax_after_rebate", "tax_after_minimum"]
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
Policy switch, NOT a rate. ⚠️ NEITHER ALLOWED VALUE IS AN EXACT MATCH FOR THE STATUTORY BASE, so
this node is verified = false even though the surrounding band table is primary-verified.

NBR Paripatra 2026-27 §1.6 says surcharge is payable "করযোগ্য আয়ের উপর … কর হার প্রয়োগ করিয়া
পরিগণিত অঙ্কের উপর" — on the amount computed by applying the Schedule 2 rates to TAXABLE INCOME.
Read literally that is the GROSS tax, before the investment rebate. TakaBooks offers only
"tax_after_rebate" and "tax_after_minimum"; "tax_after_rebate" is the closer of the two and is
what is set here. For a taxpayer who claims an investment rebate, TakaBooks may therefore compute
a surcharge slightly LOWER than a literal reading of the Paripatra gives. Have the surcharge
figure checked by an ITP or CA where a rebate is claimed and the taxpayer is in a surcharge band.
(The choice between the two allowed values is itself immaterial in practice: anyone with more
than Tk 4 crore of net assets has tax far above the Tk 5,000 minimum, so tax_after_minimum and
tax_after_rebate are the same number for every taxpayer who actually pays surcharge.)
"""

  [income_tax.individual.surcharge.minimum]
  value = 0
  unit = "BDT"
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = false
  placeholder = false
  note = """
Zero — there is NO minimum surcharge for AY 2026-27 so far as can be established. This is a
NEGATIVE finding, not a positive reading: the surcharge table at NBR Paripatra 2026-27 §1.6
contains no minimum-surcharge line, and none of the professional summaries mentions one. It is
marked verified = false because the absence of a provision cannot be verified from an excerpt.
A zero floor never raises anything, so it is the safe value: it can only ever understate by the
amount of a floor that may not exist. If a later reading of Schedule 2 turns up a floor, land it
here.
"""

[[income_tax.individual.surcharge.bands]]
order = 1
label_en = "Net assets up to Tk 4 crore — nil"
label_bn = "নিট পরিসম্পদ ৪ কোটি টাকা পর্যন্ত — শূন্য"
# No `wealth_above` node: this band starts at zero net wealth.

  [income_tax.individual.surcharge.bands.rate]
  value = 0
  unit = "percent"
  source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
Nil. NBR Paripatra 2026-27 §1.6(ক): "নিট পরিসম্পদের পরিমাণ ৪ (চার) কোটি টাকা পর্যন্ত — শূন্য".
⚠️ A taxpayer inside this band can still owe 10% on either of the non-wealth triggers (more than
one motor car; house property over 8,000 sq ft in a city corporation). See the section note.
"""

