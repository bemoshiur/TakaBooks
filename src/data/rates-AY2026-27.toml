# =========================================================================================
# VAT — মূল্য সংযোজন কর (মূসক)
# =========================================================================================
# Statute: মূল্য সংযোজন কর ও সম্পূরক শুল্ক আইন, ২০১২ (Act 47 of 2012) — bdlaws act-1106 —
# together with মূল্য সংযোজন কর ও সম্পূরক শুল্ক বিধিমালা, ২০১৬ (SRO 333-Ain/2016/1-Mushak,
# 3 November 2016). Three separate 2026 instruments amend it and all three matter:
#
#   Act 96 of 2026  অর্থ আইন, ২০২৬ (Finance Act 2026)      FY2026-27 measures, eff. 1 Jul 2026
#   Act 89 of 2026  অর্থ (২০২৫-২০২৬ অর্থ বৎসর) আইন, ২০২৬   ratifies the Finance Ordinance 2025
#   Act 77 of 2026  মূসক ও সম্পূরক শুল্ক (সংশোধন) আইন, ২০২৬  ratifies the 9 Jan 2025 ordinance,
#                                                          effective RETROSPECTIVELY 9 Jan 2025
#
# Act 77 is why the registration and enlistment thresholds below are NOT budget figures:
# they date from 9 January 2025, and almost every chart in circulation still prints the
# pre-2025 numbers.
#
# -----------------------------------------------------------------------------------------
# HOW TO UPDATE THIS SECTION AFTER A FINANCE ACT
# -----------------------------------------------------------------------------------------
#   1. Read the amending instrument itself — the gazette, or bdlaws act-1106 (which carries
#      an amendment footnote on every section). Never a practitioner blog, never a news
#      report of the BILL, and NEVER https://nbr.gov.bd/faq/vat-faq/eng — NBR's own VAT FAQ
#      page is years out of date (it still shows a Tk 80 lakh registration threshold, 3%
#      turnover tax and monthly returns) and is the likely origin of several wrong figures
#      circulating in secondary write-ups.
#   2. Reduced and specific rates live in the THIRD SCHEDULE, published by the Legislative
#      Division as a separate consolidated PDF linked from the act-1106 page under "তফসিল".
#      Check the Schedule AND the SRO stream: several headline rates were deleted from the
#      Schedule in January 2025 and immediately re-instated by notification, so the Schedule
#      alone will mislead you (see the [vat.rates.reduced] comment block).
#   3. Land the figure, set `source` to that instrument's URL, set `as_of`, set
#      `verified = true` only if you read the PRIMARY text, and rewrite `note`.
#
# -----------------------------------------------------------------------------------------
# CONVENTIONS USED IN THIS SECTION
# -----------------------------------------------------------------------------------------
#   * `as_of` is the date the instrument that SETS the figure took effect, or the date on
#     the face of the document read. Where the research could establish neither, `as_of` is
#     2026-09-05 — the date the consolidated primary text was read — and `note` says so.
#   * `verified = true` ONLY where the figure was read from primary text: the Bangla statute
#     on bdlaws.minlaw.gov.bd (current through the Finance Act 2026), the consolidated
#     Schedules PDF, an SRO gazette, or NBR's own published form. Where a figure rests on
#     professional summaries (PwC / KPMG / Tuhin & Partners) it is `verified = false` and
#     `note` says which. The Finance Act 2026 gazette PDF is typeset in a legacy Bijoy Bangla
#     font that does not text-extract, so its own Schedules could not be read directly.
#   * `placeholder = true` is used here for a figure the research explicitly declined to
#     certify. The figure is recorded so a human can see the candidate and its caveat, but
#     rates.py refuses to hand it to a calculator without --allow-placeholder-rates. That is
#     deliberate: absent beats wrong.
#   * English service names and the Bangla labels on the reduced-rate nodes are renderings,
#     not decoded Schedule text. Service CODES and RATE figures in the Schedules PDF are
#     readable; goods descriptions largely are not. Check a label against the Schedule
#     before quoting it to NBR.
# =========================================================================================

[vat]
note = """
`rates.reduced` holds every rate below the standard rate, keyed by the supply it applies to.
Bangladesh's reduced/truncated structure changes often — land one node per rate that this AY
actually has, and delete the placeholder.

Landed for AY 2026-27 from the VAT & SD Act 2012 as amended by Acts 77, 89 and 96 of 2026,
read on bdlaws.minlaw.gov.bd. Three things in this section contradict what most published
charts say, and all three are deliberate:
  * registration Tk 50 lakh / enlistment Tk 30 lakh — since 9 January 2025, not 3 crore/50 lakh;
  * returns are QUARTERLY from 1 July 2026, not monthly;
  * the input tax credit window is SIX tax periods, not four.
"""

# -----------------------------------------------------------------------------------------
# RATES
# -----------------------------------------------------------------------------------------

  [vat.rates.standard]
  label_en = "Standard VAT rate"
  label_bn = "প্রমিত মূসক হার"
  value = 15
  unit = "percent"
  source = "http://bdlaws.minlaw.gov.bd/act-1106/section-42308.html"
  as_of = "2019-07-01"
  verified = true
  placeholder = false
  note = """
15% on every taxable supply and every taxable import — s.15(3) of the VAT & SD Act 2012.
Read from the Bangla statute on bdlaws, which is current through the Finance Act 2026.
s.15(3) was last substituted by Finance Act 2019 s.62 (hence as_of 2019-07-01) and was
touched by neither the Finance Ordinance 2025 nor the Finance Act 2026, so 15% stands for
FY2026-27. First proviso: the Government may fix a REDUCED rate or a SPECIFIC amount for
goods and services listed in the Third Schedule. Second proviso: a registered person may
ELECT to pay 15% instead of a Third Schedule reduced or specific rate — normally to preserve
full input tax credit, which s.46(1)(tha) otherwise denies on inputs to a below-15% supply.
"""

  [vat.rates.zero_rated]
  label_en = "Zero-rated supplies (exports)"
  label_bn = "শূন্যহার সরবরাহ (রপ্তানি)"
  value = 0
  unit = "percent"
  source = "http://bdlaws.minlaw.gov.bd/act-1106.html"
  as_of = "2026-09-05"
  verified = true
  placeholder = false
  note = """
Zero rate on exports, supplies for export and zero-rated services — ss.21 to 24 of the VAT &
SD Act 2012. A zero-rated supply carries 0% output VAT while the input VAT on it stays
rebateable; s.46(1)(tha), which otherwise kills input credit on below-15% supplies, carves
exports out expressly. Read from the statute on bdlaws; the sections carry no amendment
attributable to the Finance Act 2026, so as_of is the date the consolidated text was read.
Do not confuse zero-rating with EXEMPTION (অব্যাহতি, First Schedule + s.126 SROs): an exempt
supply carries no output VAT AND no input credit.
"""

  [vat.rates.imported_services]
  label_en = "Imported services — reverse-charge VAT"
  label_bn = "আমদানিকৃত সেবার উপর মূসক (বিপরীত চার্জ)"
  value = 15
  unit = "percent"
  source = "http://bdlaws.minlaw.gov.bd/act-1106.html"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
s.20 of the VAT & SD Act 2012 was REPLACED by the Finance Act 2026, effective 1 July 2026:
imported services are taxable at 15%, payable by the RECIPIENT as output VAT under the
reverse charge. Read from the Act 96 of 2026 gazette text on bdlaws in clean Unicode. At
remittance the bank / authorised dealer deposits the VAT by a-challan under the importer's
circle and economic codes, and that challan serves as BOTH the tax invoice and the input tax
credit document. s.46(1)(kha) denies the credit if the recipient does not separately show
the output tax in the return.
"""

