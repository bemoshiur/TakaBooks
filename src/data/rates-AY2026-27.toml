[income_tax.individual.minimum_tax]
note = """
Two independent floors: a flat amount that depends on where the taxpayer is located, and a
percentage of gross receipts for taxpayers with business turnover. tax.py takes the greater
of the two applicable floors and then the greater of (tax after rebate, that floor).
"""

  [income_tax.individual.minimum_tax.applies_when]
  value = "taxable_income_above_threshold"
  unit = "policy"
  allowed = ["always", "taxable_income_above_threshold", "never"]
  source = "https://nbr.gov.bd/"
  as_of = ""
  verified = false
  placeholder = true
  note = """
PLACEHOLDER policy switch, NOT a rate. It decides whether the location floor bites for a
taxpayer whose income sits below the tax-free threshold. Confirm the rule, then set one of
the allowed values and mark it verified. tax.py rejects any other value.
"""

