# -----------------------------------------------------------------------------------------
# INPUT TAX CREDIT — উপকরণ কর রেয়াত (s.46)
# -----------------------------------------------------------------------------------------
# s.46(1) grants the credit subject to fifteen disallowances; s.46(2) is an absolute bar on
# three classes; s.46(3) lists the documents that support a claim. The numeric conditions are
# nodes below. The non-numeric ones, which kill just as many claims, are:
#
#   s.46(1)(kha) imported services where the recipient did not separately show the output tax
#   s.46(1)(gha) VAT on goods or services in another's possession — EXCEPT contract manufacturing
#   s.46(1)(uma) goods or services not entered in the prescribed purchase book (Mushak 6.1/6.2.1)
#   s.46(1)(cha) tax invoice not stating the name, address AND BIN of BOTH buyer and seller
#   s.46(1)(chha) importer's invoice omitting the goods declaration number, or a description
#                 that does not properly match commercially
#   s.46(1)(ja)  inputs released against a bank guarantee, until final settlement
#   s.46(1)(jha) inputs used to produce EXEMPT goods or supply exempt services
#   s.46(1)(yna) turnover tax paid
#   s.46(1)(ta)  supplementary duty paid on inputs
#   s.46(1)(tha) inputs to a supply taxed BELOW 15% or at a specific rate — EXCEPT exports
#   s.46(1)(da)  inputs not declared in the input-output coefficient (Mushak 4.3), except
#                Board-determined fields (inserted by Finance Act 2026 s.8(a)(ii)) and except
#                the supply of services
#   s.46(1)(na)  supplies at LESS THAN input value — SUBSTITUTED by Finance Act 2026
#                s.8(a)(iii): previously the WHOLE credit was disallowed, now only the input
#                tax in excess of the output tax payable. This is a genuine improvement.
#   s.46(2)      absolute bar: passenger vehicles, their spare parts and their repair or
#                maintenance (unless dealing, hiring out or transport is the person's economic
#                activity and the vehicle was acquired for it); entertainment (unless providing
#                entertainment is the economic activity, given in the normal course); and
#                membership or right of entry to a sports, social or recreational club.
#                Clause (gha) was DELETED by Finance Act 2026 s.8(b).
#
# ⭐ Finance Act 2026 s.2(a) DELETED "শ্রম" (labour) from the negative list in the definition of
#    "input" at s.2(18A), effective 1 July 2026 — so labour and manpower-supply costs can now
#    qualify as an input and carry credit. Still NOT inputs: land; buildings; office equipment
#    and fixtures; construction, renovation, modernisation, replacement, extension or repair of
#    buildings or infrastructure; furniture, office supplies, stationery, refrigerators and
#    freezers, air conditioners, fans, lighting, generators and their repair; interior design
#    and architectural planning; purchase, rent or lease of vehicles; travel, entertainment,
#    employee welfare and development work; and rent of business premises, office or showroom.
#
# Where a person makes both taxable and exempt supplies, s.47 (আংশিক উপকরণ কর রেয়াত) governs
# the apportionment — http://bdlaws.minlaw.gov.bd/act-1106/section-42343.html

