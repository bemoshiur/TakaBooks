# -----------------------------------------------------------------------------------------
# Investment rebate / বিনিয়োগজনিত কর রেয়াত
# -----------------------------------------------------------------------------------------
# tax.py computes:
#     eligible = min(investment claimed, taxable_income x income_cap_percent, absolute_cap)
#     rebate   = eligible x rate           (then capped at the gross tax — a rebate can
#                                           never turn a liability negative)
# If this AY uses a different construction (e.g. a different set of caps), change the nodes
# here and say so in `formula`; tax.py reads `formula` and refuses any value it does not
# implement rather than silently computing the wrong thing.

[income_tax.individual.rebate]
formula = "min_of_three_caps"       # allowed: "min_of_three_caps"
formula_note = """
"min_of_three_caps": eligible investment is the least of (a) the amount actually invested,
(b) income_cap_percent of taxable income, (c) absolute_cap. Rebate = rate x eligible.
"""

  [income_tax.individual.rebate.rate]
  value = 0
  unit = "percent"
  source = "https://nbr.gov.bd/"
  as_of = ""
  verified = false
  placeholder = true
  note = "PLACEHOLDER — rebate rate on eligible investment is not verified."

  [income_tax.individual.rebate.income_cap_percent]
