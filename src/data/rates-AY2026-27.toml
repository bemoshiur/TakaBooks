# =========================================================================================
# s.142 — THE PSR UPLIFT AND THE BANK-TRANSFER UPLIFT
# =========================================================================================
# ⚠️ FRAMED AROUND PROOF OF SUBMISSION OF RETURN (PSR), NOT AROUND POSSESSION OF A TIN.
# A payee may hold a TIN and still trigger the uplift by failing to furnish PSR.

  [tds.sections.142]
  section = "142"
  label_en = "Uplifted rate where PSR is not furnished, or where payment is not made by bank transfer"
  label_bn = "রিটার্ন দাখিলের প্রমাণ (পিএসআর) দাখিল না করিলে বা ব্যাংক ট্রান্সফারে পরিশোধ না করিলে বর্ধিত হার"
  applies_to = "Any deduction under Part 7 other than a payment to a non-resident under s.119."
  deducted_by = "The person otherwise responsible for the deduction."
  condition = "s.142(1) opens 'ধারা ১১৯ এর ব্যতিক্রম সাপেক্ষে' — subject to the exception of s.119 — so NON-RESIDENT PAYMENTS ARE OUTSIDE IT."
  source = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
  as_of = "2026-07-01"
  verified = true
  placeholder = false
  note = """
CARVE-OUTS FROM s.142(1), both of which the payer must check before uplifting:
  · s.119 payments to non-residents are excluded by the opening words of s.142(1).
  · Proviso added by Act 89 of 2026 s.88: the uplift does NOT apply to a person for whom
    filing is not mandatory under s.166(2), nor to a person the Board has exempted from
    furnishing PSR under s.264(4).

WHAT COUNTS AS PSR (s.264): an acknowledgement receipt of the income tax return, a
system-generated tax certificate, or a certificate issued by the Deputy Commissioner of Taxes
— each bearing the payee's name, TIN and the assessment year the return was submitted for.
A bare TIN certificate is NOT PSR.

GROSS-UP, s.141 read with Rule 12 of SRO 273: where the payment is agreed tax-free,
  C = (100 × A) / (100 − B)
where A is the tax-free payment and B is the applicable rate. Where the payee fails PSR or
does not take payment by bank transfer, B IS THE UPLIFTED RATE — so a tax-free contract with a
non-filing payee costs the payer materially more.
"""

    [tds.sections.142.psr_uplift]
    label_en = "PSR uplift — payee required to furnish proof of submission of return and fails to"
    label_bn = "পিএসআর বর্ধিতকরণ — রিটার্ন দাখিলের প্রমাণ দাখিল করিতে ব্যর্থ হইলে"
    value = 50
    unit = "percent"
    source = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
    as_of = "2026-07-01"
    verified = true
    placeholder = false
    note = """
s.142(1). READ THE UNIT: this is 50 PERCENT HIGHER THAN THE APPLICABLE RATE, i.e. the rate is
multiplied by 1.5 — NOT 50 percentage points added. A 5% rate becomes 7.5%, not 55%. A 10%
rate becomes 15%. This is the single most common arithmetic error in Bangladeshi withholding.
"""

    [tds.sections.142.bank_transfer_uplift]
    label_en = "Bank-transfer uplift — payee does not receive the payment through bank transfer"
    label_bn = "ব্যাংক ট্রান্সফার বর্ধিতকরণ — ব্যাংক ট্রান্সফারের মাধ্যমে অর্থ গ্রহণ না করিলে"
    value = 50
    unit = "percent"
    source = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
    as_of = "2026-07-01"
    verified = true
    placeholder = false
    note = """
s.142(2). Same construction: the rate is 50% higher, i.e. multiplied by 1.5. Triggered where
the payee does not receive the contract value, bill, rent, fee, charge, remuneration, salary
or other payment through bank transfer. A cash or cheque-in-hand settlement of an otherwise
ordinary bill is enough to trigger it.
"""

    [tds.sections.142.uplift_stacking]
    label_en = "UNRESOLVED — whether the two 50% uplifts compound when both are triggered"
    label_bn = "অমীমাংসিত — উভয় বর্ধিতকরণ একত্রে প্রযোজ্য হইলে তাহা যৌগিক হইবে কি না"
    value = "unresolved"
    unit = "policy"
    source = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
    as_of = "2026-07-01"
    verified = false
    placeholder = false
    note = """
⚠️ THIS IS NOT VERIFIED AND CANNOT BE, ON THE MATERIAL THAT EXISTS TODAY. Both s.142(1) and
s.142(2) independently say the rate "shall be 50% higher than the applicable rate"
(প্রযোজ্য হার), neither cross-refers to the other, and NEITHER SRO 273 NOR THE PARIPATRA
2026-27 CONTAINS A SINGLE WORKED EXAMPLE APPLYING EITHER UPLIFT, LET ALONE BOTH. There is no
stated maximum anywhere in the Act or the Rules.

So the three readings are all arguable and TakaBooks will not choose between them:
  (a) 1.5× — the uplifts do not compound; one 50% uplift is the most that can apply;
  (b) 2.0× — the two 50% uplifts are additive on the base rate (+100%);
  (c) 2.25× — the uplifts compound multiplicatively (1.5 × 1.5).

WHAT TO DO: apply ONE uplift, disclose the second trigger to the taxpayer in writing, and seek
a ruling from NBR before settling on a combined rate. Do not let a spreadsheet silently
compound them — that is how a payer ends up either under-deducting (and owing the shortfall
plus 50% of it under s.56(1)) or over-deducting from a supplier who cannot recover it easily.

WHAT WOULD CONFIRM IT: an NBR clarification, a worked example in a future Paripatra, or an
amendment inserting a maximum into s.142. None exists as at 5 September 2026.
"""

