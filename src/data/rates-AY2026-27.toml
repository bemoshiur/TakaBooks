# =========================================================================================
# s.119 — PAYMENTS TO NON-RESIDENTS
# Rule 5 of SRO 273 · ধারা ১১৯, উৎসে কর বিধিমালা ২০২৬ এর বিধি ৫
# =========================================================================================
# The full 30-row category table. s.119(1) now sets only a ceiling (30%); the categories live
# in Rule 5. Every row below was read from the SRO 273 gazette and cross-read against
# Appendix-1 of the Paripatra 2026-27.

  [tds.sections.119]
  section = "119"
  label_en = "Payments to non-residents"
  label_bn = "অনিবাসীকে প্রদত্ত অর্থ"
  applies_to = "Any payment to a non-resident falling in a Rule 5 category. Serial 30 is a residual, so in practice every outbound payment not excluded by Rule 5(3) is caught."
  deducted_by = "The person making the payment, and the bank effecting the remittance."
  condition = "s.119(2): on application with documents the Board must, WITHIN 30 DAYS, certify nil or reduced deduction under a tax treaty or otherwise. Get the certificate before remitting — you cannot recover the deduction afterwards from the payee."
  source = "https://nbr.gov.bd/uploads/rules/With_holding_2026.pdf"
  as_of = "2026-07-05"
  verified = true
  placeholder = false
  note = """
⚠️ TWO THINGS THAT CHANGE THE ANSWER COMPLETELY:

1. s.119(3), NEW (Finance Act 2026 s.74): tax withheld from a NON-RESIDENT WITH NO PERMANENT
   ESTABLISHMENT in Bangladesh is that recipient's FINAL TAX on the income and CANNOT be
   adjusted against any claim. Permanent establishment and residence are determined under the
   applicable double taxation avoidance agreement, or under the Income Tax Act 2023 where
   there is no DTAA.

2. The s.142 uplift does NOT reach these payments. s.142(1) opens
   "ধারা ১১৯ এর ব্যতিক্রম সাপেক্ষে" — subject to the exception of s.119 — so non-resident
   payments sit outside the PSR uplift. See [tds.sections.142].

s.119(4): a share transfer giving rise to a non-resident capital gain may not be REGISTERED
until the tax is paid. The registration block, not a penalty, is the enforcement mechanism.

Nine categories of outbound payment carry NO deduction at all — see [tds.sections.119.exclusions].
"""

