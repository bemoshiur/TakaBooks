# -----------------------------------------------------------------------------------------
# THRESHOLDS — the most commonly misreported figures in Bangladesh VAT
# -----------------------------------------------------------------------------------------
# Bands for FY2026-27:
#   annual turnover ≤ Tk 30 lakh          no registration, no enlistment
#   Tk 30 lakh to Tk 50 lakh              turnover tax enlistment, 4%
#   above Tk 50 lakh                      mandatory VAT registration, 15% regime
# s.4(2) overrides all of it: some persons must register IRRESPECTIVE of turnover.

  [vat.thresholds.registration]
  label_en = "VAT registration threshold (annual turnover)"
  label_bn = "মূসক নিবন্ধনের সীমা (বার্ষিক টার্নওভার)"
  value = 5000000
  unit = "BDT"
  source = "http://bdlaws.minlaw.gov.bd/act-1106/section-42295.html"
  as_of = "2025-01-09"
  verified = true
  placeholder = false
  note = """
Tk 50 lakh. s.2(57) of the VAT & SD Act 2012, substituted from "৩ (তিন) কোটি" by the VAT & SD
(Amendment) Act 2026 (Act 77 of 2026) s.2(b), effective RETROSPECTIVELY from 9 January 2025.
Read from the Bangla statute on bdlaws with its amendment footnote.
⚠️ The widely circulated Tk 3 crore registration threshold is OUT OF DATE, as is the Tk 80
lakh figure that NBR's own stale VAT FAQ page still shows. Do not use either.
Registrable under s.4(1) from the first day of a month if turnover in the preceding 12 months
exceeded this, OR estimated turnover for the next 12 months will exceed it. The threshold does
NOT apply at all to the s.4(2) persons — anyone dealing in supplementary-duty goods or
services, supplying through a tender, contract or work order, in import-export business,
running a branch/liaison/project office of a foreign entity, appointed a VAT agent, or
operating in a Board-specified area or product — they must register on any turnover.
The Finance Bill 2026 proposed deleting the enlistment threshold so that any turnover up to
Tk 50 lakh would require enlistment; that was NOT enacted.
"""

  [vat.thresholds.turnover_tax_enlistment]
  label_en = "Turnover tax enlistment threshold (annual turnover)"
  label_bn = "টার্নওভার কর তালিকাভুক্তির সীমা (বার্ষিক টার্নওভার)"
  value = 3000000
  unit = "BDT"
  source = "http://bdlaws.minlaw.gov.bd/act-1106/section-42295.html"
