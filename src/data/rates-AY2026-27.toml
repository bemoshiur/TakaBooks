# =========================================================================================
# SECTION — TDS (উৎসে কর কর্তন) and VDS (উৎসে মূসক কর্তন)  ·  [tds] and [vds]
#
# Read by src/engine/vat.py (vds.deposit.deadline) and quoted by the assistant.
# TakaBooks — Moshiur Rahman (@bemoshiur) · Ticon Sys — https://ticonsys.com
#
# -----------------------------------------------------------------------------------------
# WHICH INSTRUMENT SETS THESE RATES — read this before changing a single figure
# -----------------------------------------------------------------------------------------
# TDS rates for FY2026-27 are set by উৎসে কর বিধিমালা, ২০২৬ =
#   এস.আর.ও. নং ২৭৩-আইন/আয়কর-৫/২০২৬, gazetted 5 July 2026, deemed effective 1 July 2026,
#   made under s.343 of the Income Tax Act 2023.
#
#   ⚠️ A SECOND SRO OF 2026 CARRIES THE IDENTICAL TITLE. এস.আর.ও. নং ২১০-আইন/আয়কর-১/২০২৬
#   of 8 June 2026 was EXPRESSLY REPEALED by Rule 14 of SRO 273. Nearly every FY2026-27 TDS
#   chart circulating online reproduces the REPEALED SRO 210 and is wrong — materially so for
#   the s.90 services table (SRO 210 put catering/PR/event management/creative media at 4% on
#   gross; SRO 273 puts catering at 2% on total bill and creative media at 10% on commission
#   or 1% on gross bill, whichever is higher). Discard any chart citing SRO 210.
#
#   ⚠️ A widely repeated citation is also wrong in two places at once: "SRO No. 273-Law/
#   Income Tax-5/2028, dated 30 June 2026". The instrument is ২৭৩-আইন/আয়কর-৫/২০২৬ and it was
#   gazetted 5 July 2026.
#
#   ⚠️ NBR's own download page mislabels the SRO 273 PDF "The Withholding Tax Rules, 2026
#   (Amendment)". It is a complete standalone re-enactment, not an amendment.
#
# VDS rates are set by উৎসে মূল্য সংযোজন কর কর্তন ও আদায় বিধিমালা, ২০২৫ =
#   এস.আর.ও. নং ১৮২-আইন/২০২৫/৩১০-মূসক of 27 May 2025 (commenced 1 July 2025), as amended by
#   এস.আর.ও. নং ১৪০-আইন/২০২৬/৩৪৫-মূসক of 7 June 2026 (commences 1 July 2026).
#
#   ⚠️ "SRO 258-Law/2026/358-VAT" DOES NOT EXIST. That citation circulates on practitioner
#   blogs and is wrong. NBR's VAT-SRO index tops out at SRO 148 of 11 June 2026.
#
# -----------------------------------------------------------------------------------------
# SOURCE URLS USED IN THIS FRAGMENT — each node cites the one that carries its figure
# -----------------------------------------------------------------------------------------
#   [SRO273] https://nbr.gov.bd/uploads/rules/With_holding_2026.pdf
#   [PARI]   https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf   (2 Sep 2026)
#   [ACT]    http://bdlaws.minlaw.gov.bd/act-details-1429.html  (ITA 2023, consolidated text
#            current through the Finance Act 2026, each section carrying its amendment note)
#   [FA2026] https://nbr.gov.bd/uploads/acts/Finance_Act_2026.pdf  (Act 96 of 2026, 30 Jun 2026)
#   [SRO182] https://nbr.gov.bd/uploads/sros/VATSRO-1822.pdf      (VDS Rules 2025)
#   [SRO140] https://nbr.gov.bd/uploads/sros/VAT_SRO-140.pdf      (amends the VDS Rules 2025)
#   [VATACT] http://bdlaws.minlaw.gov.bd/act-1106.html            (VAT & SD Act 2012)
#
# Every SRO 273 rate below was read TWICE and reconciled — once from NBR's clean-Unicode
# reproduction of SRO 273 in Appendix-1 of the আয়কর পরিপত্র ২০২৬-২০২৭, and once by decoding
# the legacy-Bijoy-encoded gazette PDF of SRO 273 itself. That is why they carry
# verified = true. Note the honest limit on that: NO third-party professional publication
# reflecting SRO 273 was found (PwC's Finance Act 2026 note predates it), so the s.89, s.90
# and s.119 tables have two primary renderings that agree and no independent professional
# cross-check.
#
# -----------------------------------------------------------------------------------------
# HOW TO UPDATE AFTER THE NEXT FINANCE ACT
# -----------------------------------------------------------------------------------------
#   1. Find the new উৎসে কর বিধিমালা SRO on https://nbr.gov.bd/regulations/sros/income-tax
#      — CHECK ITS NUMBER AND DATE against any earlier SRO of the same title in the same year,
#      and read its repeal rule. This has now happened twice.
#   2. Cross-read every rate against Appendix-1 of that year's আয়কর পরিপত্র.
#   3. Replace value / source / as_of node by node. Do not bulk-edit.
#   4. Anything you could not read from primary text stays verified = false with a note that
#      says exactly what is missing. Absent beats wrong.
# =========================================================================================

# =========================================================================================
# TDS — উৎসে কর কর্তন (income tax deducted or collected at source)
# =========================================================================================
# Journal tag grammar: TDS:<section>:<rate>, e.g. TDS:89:5 or TDS:90:10.
# <section> is the Income Tax Act 2023 section that AUTHORISES the deduction, even where the
# rate itself sits in a rule of SRO 273. That is deliberate: the section is what the payee's
# certificate, the quarterly return and the assessment all key on.

[tds]
tag_grammar = "TDS:<section>:<rate>"
note = """
One [tds.sections.<id>] table per Income Tax Act 2023 section. `<id>` matches what the
journal writes ("89", "90", "109", "112A"). The section table itself is metadata and carries
no `value`; each rate that section can produce is a child table with the full node contract.
Where a section offers several rates the child key names the condition (payee type, basis,
goods class), because Bangladeshi withholding is almost never one rate per section.

TWO SIDES, NEVER CONFLATED. Tax deducted FROM you is an advance against your own liability
(a receivable). Tax deducted BY you is somebody else's money you are holding (a liability,
plus a deposit duty, plus a certificate you owe them). See src/references/withholding-tds-vds.md.

STRUCTURAL CHANGE YOU MUST NOT MISS: from 1 July 2026 withholding is NO LONGER broadly
minimum tax. s.163 was replaced and s.164 repealed by the Finance Act 2026. Excess
withholding is refundable or carry-forward adjustable. See [tds.final_tax].
"""

