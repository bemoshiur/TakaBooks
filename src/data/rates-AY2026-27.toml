for AY 2028-29 and Tk 6,25,000 for AY 2030-31.
"""

[income_tax.individual.thresholds.gazetted_war_wounded_freedom_fighter]
label_en = "Gazetted war-wounded freedom fighter"
label_bn = "গেজেটভুক্ত যুদ্ধাহত মুক্তিযোদ্ধা"
