# The instruments this file's figures come from. These are the URLs a `source` key may cite;
# the bare authority_url above names the authority and is NEVER an acceptable `source`.
governing_income_tax_act = "http://bdlaws.minlaw.gov.bd/act-details-1429.html"
governing_finance_act = "https://nbr.gov.bd/uploads/acts/Finance_Act_2026.pdf"
governing_paripatra = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
governing_withholding_rules = "https://nbr.gov.bd/uploads/rules/With_holding_2026.pdf"

# Provenance of the two year fields above, which the core instruction reads rather than
# deriving. Do not let a model infer the year from the current date — read it from here.
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-09-02"

income_year_note = """
Income year (আয়বর্ষ) 1 July 2025 – 30 June 2026, assessed in assessment year (করবর্ষ)
2026-27 which commenced 1 July 2026. Banks, insurance companies and finance companies run a
1 January – 31 December income year instead, so for them AY 2026-27 assesses the year ended
31 December 2025. NBR's আয়কর পরিপত্র ২০২৬-২০২৭ (file no. 08.01.0000.000.030.03.029.26.112,
dated 2 September 2026) is headed with the rates "applicable for the five assessment years
2026-2027 to 2030-2031", which fixes 2026-27 as the first year of the current rate card.
The e-Return portal opened for AY 2026-27 on 22 July 2026.
"""

note = """
AY 2026-27 figures have been landed. Read every node's own `verified` flag before quoting it:

  verified = true   The figure was read from primary text — NBR's আয়কর পরিপত্র ২০২৬-২০২৭
                    (Income Tax Paripatra 2026-27, published 2 September 2026), the gazette of
                    an SRO, or the enacted text on bdlaws.minlaw.gov.bd.
  verified = false  The figure rests on post-enactment professional summaries (PwC Bangladesh,
                    KPMG / Rahman Rahman Huq, Tuhin & Partners) that agree with one another,
                    because the Finance Act 2026 gazette PDF is published in a legacy Bijoy
                    Bangla font encoding that does not extract to readable text. The node's
                    `note` says exactly what is unconfirmed and what would confirm it.
  placeholder = true  Nothing was landed. rates.py refuses the value outright.

Governing law: আয়কর আইন, ২০২৩ (Income Tax Act 2023, Act 12 of 2023) as amended by অর্থ আইন,
২০২৬ (Finance Act 2026, Act 96 of 2026), which received presidential assent and was published
in the Bangladesh Gazette Extraordinary on 30 June 2026 and took effect 1 July 2026. The
Finance Act 2026 legislates income tax rates for FIVE assessment years, 2026-27 through
2030-31; this file models AY 2026-27 only.

TakaBooks is bookkeeping and taxation software, not a tax adviser. Nothing computed from this
file is professional advice. Have a Bangladeshi Income Tax Practitioner or Chartered
Accountant review any return before it is filed with NBR.
"""


# =========================================================================================
# SECTION — INCOME TAX  ·  [income_tax.individual] and [income_tax.corporate]
# Read by src/engine/tax.py (individual only). Assembled from the AY 2026-27 research pass.
#
# SOURCE / AS_OF CONVENTION USED THROUGHOUT THIS FRAGMENT
#   `source` names the document the figure was actually READ FROM.
#   `as_of`  names the date the INSTRUMENT takes effect. Almost every figure here is set by
#            অর্থ আইন, ২০২৬ (Finance Act 2026, Act 96 of 2026), gazetted 30 June 2026 and
#            effective 1 July 2026, so as_of = "2026-07-01" nearly everywhere.
#
#   verified = true  → read from NBR's আয়কর পরিপত্র ২০২৬-২০২৭ (Income Tax Paripatra 2026-27,
#                      file 08.01.0000.000.030.03.029.26.112 dated 2 September 2026), which
#                      reproduces the Finance Act 2026 rate schedules in NBR's own words.
#   verified = false → read from a post-enactment professional summary (PwC Bangladesh, KPMG /
#                      Rahman Rahman Huq, Tuhin & Partners). The Finance Act 2026 gazette PDF
#                      is set in a legacy Bijoy Bangla font that does not extract to readable
#                      text, so its Schedules could not be read directly. Each such node's
#                      `note` says what is unconfirmed and what would confirm it.
#
# THE FIVE-YEAR RATE CARD. The Finance Act 2026 fixes individual rates and thresholds for AY
# 2026-27 through AY 2030-31. This file models AY 2026-27 ONLY, because the schema has one
# slot per figure and a rates file is per assessment year. For the record, the future years
# (Paripatra §§1.2–1.3), so a maintainer preparing rates-AY2028-29.toml does not have to
# re-research them:
#   AY 2026-27 & 2027-28  0 / 10 / 15 / 20 / 25 / 30 — top rate 30%, NO 35% band.
#   AY 2028-29 & 2029-30  threshold 450,000; then 10/15/20/25, 30% on the next 26,350,000,
#                         35% on the remainder.
#   AY 2030-31            threshold 500,000; then 10/15/20/25, 30% on the next 26,300,000,
#                         35% on the remainder.
# Do NOT apply a 35% band to AY 2026-27. It does not begin until AY 2028-29.
# =========================================================================================

# =========================================================================================
# INCOME TAX — INDIVIDUAL / ব্যক্তি করদাতার আয়কর
# =========================================================================================

[income_tax.individual]
default_category = "general"
default_location = "all_areas"
note = """
The tax-free threshold varies by taxpayer category; the slab WIDTHS above the threshold do
not. That is why slab 1 takes its width from the selected category threshold
(width_source = "category_threshold") and the remaining slabs carry their own width.

`default_location` is "all_areas" because the Finance Act 2026 ABOLISHED the location basis of
the individual minimum tax. The old Dhaka/Chattogram/other-city-corporation/other-area tiers
are gone from AY 2026-27 and have been removed from this file rather than left in place with
equal values — leaving them would tell a reader the distinction still exists. See
[income_tax.individual.minimum_tax].

NOT MODELLED HERE, and a user must be told so rather than given a wrong number:
  * Non-resident individuals who are not non-resident Bangladeshis are taxed at a FLAT 30%
    with no threshold and no slabs (Paripatra §1.4(1)). tax.py's slab engine cannot express
    that, so the rate is recorded at income_tax.corporate.rates.non_resident_other_taxpayer
    and must not be computed through --category.
  * Income of a taxpayer of ANY status from manufacturing cigarettes, bidi, zarda or gul is
    excluded from the individual slab table and taxed at 45% (Paripatra §§1.1, 1.4(2)); the
    rate is at income_tax.corporate.rates.non_company_tobacco_manufacturer.
  * The consolidated salary exemption (lower of one-third of employment income or Tk 500,000,
    Sixth Schedule Part 1 para 27) is applied BEFORE the income reaches this file. See
    src/references/payroll.md.
"""

# -----------------------------------------------------------------------------------------
# Tax-free thresholds by taxpayer category / করদাতার শ্রেণিভেদে করমুক্ত আয়সীমা
# -----------------------------------------------------------------------------------------
# One node per category. The KEY is the id `tax.py --category` accepts; tax.py hardcodes no
# category, so adding a category here is enough to make it selectable.
#
# ⚠️ BUDGET-DAY REPORTING OF 11 JUNE 2026 IS WRONG. News coverage quotes 375,000 general,
# 425,000 women/seniors and 500,000 for persons with disability. Those are the Finance BILL
# figures. Parliament raised every band by one step before passing the Act. The figures below
# are the ENACTED ones, read from NBR's own Paripatra.

[income_tax.individual.thresholds.general]
label_en = "General taxpayer"
label_bn = "সাধারণ করদাতা"
value = 400000
unit = "BDT"
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-07-01"
verified = true
placeholder = false
note = """
Tk 4,00,000. Read from NBR Paripatra 2026-27 §1.1, which reproduces the Finance Act 2026
Schedule 2 table for AY 2026-27 and AY 2027-28: "প্রথম ৪,০০,০০০ টাকা পর্যন্ত — শূন্য".
Applies to every resident individual and Hindu Undivided Family, and to non-resident
Bangladeshis, who does not fall in one of the categories below. Do not use the widely
reported Tk 3,75,000 — that is the un-enacted Bill figure.
"""

[income_tax.individual.thresholds.female]
label_en = "Female taxpayer"
label_bn = "নারী করদাতা"
value = 450000
unit = "BDT"
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-07-01"
verified = true
placeholder = false
note = """
Tk 4,50,000. Paripatra 2026-27 §1.1, item 1: "মহিলা করদাতা এবং ৬৫ বছর বা তদূর্ধ্ব বয়সের
করদাতার ক্ষেত্রে ৪,৫০,০০০ টাকা". The same figure covers senior citizens; see
income_tax.individual.thresholds.senior_citizen. The category is confirmed to exist for
AY 2026-27 and rises to Tk 5,00,000 for AY 2028-29 and Tk 5,50,000 for AY 2030-31.
"""

[income_tax.individual.thresholds.senior_citizen]
label_en = "Senior citizen"
label_bn = "প্রবীণ নাগরিক (৬৫ বছর বা তদূর্ধ্ব)"
value = 450000
unit = "BDT"
condition = "Taxpayer aged 65 years or above / ৬৫ বছর বা তদূর্ধ্ব বয়সের করদাতা"
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-07-01"
verified = true
placeholder = false
note = """
Tk 4,50,000. Paripatra 2026-27 §1.1, item 1, which puts women and taxpayers aged 65 or above
in one band. The qualifying age is 65 or above ("৬৫ বছর বা তদূর্ধ্ব বয়স"). The Paripatra does
not state the date on which age is tested; NBR practice is the last day of the income year
(30 June 2026), but that is not confirmed by this text — verify before filing a borderline
case.
"""

[income_tax.individual.thresholds.person_with_disability]
label_en = "Person with disability"
label_bn = "প্রতিবন্ধী ব্যক্তি"
value = 525000
unit = "BDT"
condition = "Taxpayer is a person with disability / প্রতিবন্ধী ব্যক্তি করদাতা"
source = "https://nbr.gov.bd/uploads/paripatra/আয়কর_পরিপত্র_২০২৬-২০২৭.pdf"
as_of = "2026-07-01"
verified = true
placeholder = false
note = """
Tk 5,25,000. Paripatra 2026-27 §1.1, item 2, which puts third-gender taxpayers and persons
with disability in one band. The Paripatra text does not specify the certification required to
claim the band — in practice a certificate issued under the Rights and Protection of Persons
with Disabilities Act 2013 (প্রতিবন্ধী ব্যক্তির অধিকার ও সুরক্ষা আইন, ২০১৩) is asked for, but
THAT REQUIREMENT IS NOT SOURCED HERE. Confirm the documentary requirement with the tax circle.
A parent or legal guardian of a person with disability gets a separate ADDITIONAL Tk 50,000;
see income_tax.individual.threshold_addition_per_disabled_dependant.
"""

[income_tax.individual.thresholds.third_gender]
label_en = "Third gender taxpayer"
