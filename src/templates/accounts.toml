type = "asset"
normal = "debit"
role = "tds_receivable"
description = "উৎসে কর কর্তন / TDS your customer took out of your bill and deposited against your TIN; it reduces your final income tax bill only if you hold their deduction certificate, so chase every missing certificate before year-end."
tags = ["duties-and-taxes"]

[[account]]
code = "9310"
name = "Advance Income Tax (AIT)"
name_bn = "অগ্রিম আয়কর"
type = "asset"
normal = "debit"
role = "advance_income_tax"
description = "Income tax you have already paid before assessment — advance instalments, AIT collected at import, AIT paid on vehicle registration and other statutory occasions — all set off against the year's assessed tax."
tags = ["duties-and-taxes"]

[[account]]
code = "9320"
name = "TDS Payable — deducted from vendors"
name_bn = "সরবরাহকারী হইতে উৎসে কর্তিত আয়কর (প্রদেয়)"
type = "liability"
normal = "credit"
role = "tds_payable"
description = "উৎসে কর কর্তন / TDS you took out of a supplier's, contractor's or landlord's payment; until it is deposited, the expense that created it is exposed to disallowance, so an unpaid balance here also inflates your taxable profit."
