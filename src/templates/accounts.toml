# -----------------------------------------------------------------------------------------
# 9xxx — শুল্ক ও কর সংক্রান্ত হিসাব / TAX & STATUTORY ACCOUNTS
# The 9xxx block may hold assets, liabilities and expenses. Every account here must be
# provable by a document, and nothing here is ever netted against anything else.
# -----------------------------------------------------------------------------------------

# --- মূসক / VAT side — assets --------------------------------------------------------------

[[account]]
code = "9100"
name = "VAT Input / Rebateable"
name_bn = "উপকরণ কর (রেয়াতযোগ্য মূসক)"
type = "asset"
normal = "debit"
role = "vat_input"
description = "The মূসক / VAT you paid a supplier that you may set off against the VAT you collected — only while you hold a valid মূসক ৬.৩ / Mushak 6.3 showing both BINs and have entered it in your মূসক ৬.১ / Mushak 6.1 purchase register."
tags = ["mushak", "duties-and-taxes"]

[[account]]
code = "9105"
name = "VAT Input — Non-rebateable"
name_bn = "অরেয়াতযোগ্য উপকরণ কর"
type = "expense"
normal = "debit"
description = "Input VAT the law does not let you rebate — a missing or defective Mushak 6.3, or a non-qualifying input; it is a cost of doing business and must not sit in 9100 as a fake receivable."
tags = ["mushak", "duties-and-taxes"]

[[account]]
code = "9110"
name = "Advance Tax (AT) at Import"
name_bn = "আমদানি পর্যায়ে অগ্রিম কর"
type = "asset"
normal = "debit"
description = "VAT-side advance tax collected by Customs when you import, recovered through the VAT return; it is not advance income tax (9310), and confusing the two is the most common tax-account error."
tags = ["mushak", "import", "duties-and-taxes"]

[[account]]
code = "9120"
name = "VDS Deducted by Customers"
name_bn = "গ্রাহক কর্তৃক উৎসে কর্তিত মূসক"
type = "asset"
normal = "debit"
description = "Output VAT a withholding-entity customer held back and deposited for you; you still book the full output VAT in 9200 and recover this in the return on the strength of the মূসক ৬.৬ / Mushak 6.6 certificate they must give you — no certificate, no claim."
tags = ["vds", "mushak", "duties-and-taxes"]

[[account]]
code = "9130"
name = "VAT Treasury Deposit / Current Account"
name_bn = "মূসক চলতি হিসাব ও ট্রেজারি জমা"
type = "asset"
normal = "debit"
description = "Money already banked to the government treasury against your VAT account, plus any closing balance carried forward from the last return; it is the balance the মূসক ৯.১ / Mushak 9.1 reconciles to, proven by treasury challans."
tags = ["mushak", "duties-and-taxes"]

# --- মূসক / VAT side — liabilities ---------------------------------------------------------

[[account]]
code = "9200"
name = "VAT Output Payable"
name_bn = "প্রদেয় উৎপাদ কর (মূসক)"
type = "liability"
normal = "credit"
role = "vat_output"
description = "The মূসক / VAT you charged your customers; it was never your money — you hold the government's cash until the return is filed and the balance deposited."
tags = ["mushak", "duties-and-taxes"]

[[account]]
code = "9210"
name = "Supplementary Duty Payable"
name_bn = "প্রদেয় সম্পূরক শুল্ক"
type = "liability"
normal = "credit"
role = "supplementary_duty_payable"
description = "Supplementary duty collected on SD-liable goods and services; it has its own column in every Mushak register, its own line in the return and its own treasury code, so never merge it into VAT."
tags = ["mushak", "duties-and-taxes"]

[[account]]
code = "9220"
name = "VDS Payable"
name_bn = "উৎসে কর্তিত মূসক (প্রদেয়)"
type = "liability"
normal = "credit"
role = "vds_payable"
description = "মূসক / VAT you withheld from a supplier's bill because you are a withholding entity; two duties sit in this balance — deposit it to the treasury, and issue the supplier a মূসক ৬.৬ / Mushak 6.6 so they can claim it."
tags = ["mushak", "duties-and-taxes"]

[[account]]
code = "9230"
name = "Excise Duty"
name_bn = "আবগারি শুল্ক"
type = "expense"
normal = "debit"
description = "The excise duty a bank debits against your account balance each year; it belongs here as a named line, not lost inside 6700 Bank Charges, because it has its own line in the VAT return."
tags = ["duties-and-taxes"]

[[account]]
code = "9240"
name = "Surcharges Payable (Development / ICT / Health Care / Environmental Protection)"
name_bn = "উন্নয়ন, আইসিটি উন্নয়ন, স্বাস্থ্যসেবা ও পরিবেশ সুরক্ষা সারচার্জ"
type = "liability"
normal = "credit"
description = "The statutory surcharges that ride alongside VAT or SD on specified goods and services; each has its own treasury code in Mushak 9.1, so keep them separable from VAT — most small traders will never post here."
tags = ["mushak", "duties-and-taxes"]

# --- আয়কর / income tax side ---------------------------------------------------------------

[[account]]
code = "9300"
name = "TDS Receivable — deducted by customers"
