# =========================================================================================
# TakaBooks — হিসাব তালিকা / chart of accounts (default template)
#
# TakaBooks — Moshiur Rahman (@bemoshiur) · Ticon Sys — https://ticonsys.com
#
# A starting chart for a Bangladeshi SME — a trading business or a service business.
# init_books.py copies this file to books/accounts.toml; from then on it is yours.
# Delete what you do not need, add what you do. Scripts only ever READ this file.
#
# HOW THE CODES WORK (spec §4.4)
#   4 digits. The first digit is the class; the next digits are allocated in steps of 5 or
#   10 so you can insert your own accounts without renumbering anything:
#     1xxx সম্পদ / assets            2xxx দায় / liabilities        3xxx মূলধন / equity
#     4xxx আয় / income              5xxx বিক্রীত পণ্যের ব্যয় / cost of goods sold
#     6xxx পরিচালন ব্যয় / operating expenses               7xxx অন্যান্য আয় / other income
#     8xxx অন্যান্য ব্যয় / other expenses                    9xxx কর হিসাব / tax & statutory
#   No Bangladeshi authority prescribes account codes; the codes are ours, the NAMES carry
#   the weight (the মূসক / VAT terms are the statutory ones). Keep the names, renumber freely.
#
# KEYS ON EVERY [[account]]  (any other key is rejected by the engine)
#   code        "1100"                              unique, 4 digits
#   name        English name
#   name_bn     Bangla name (বাংলা নাম) — how the bookkeeper reads the voucher
#   type        asset | liability | equity | income | expense
#   normal      debit for asset/expense · credit for liability/equity/income (enforced)
#   description one plain sentence an owner can act on — optional but every line here has one
#   role        engine lookup key; the ten Bangladesh roles below MUST each sit on exactly
#               one account, whatever code you give it:
#                 vat_input · vat_output · tds_receivable · tds_payable · vds_payable ·
#                 advance_income_tax · provident_fund_payable · gratuity_provision ·
#                 wppf_payable · supplementary_duty_payable
#   tags        free labels. Meaningful ones:
#                 "contra"    balance runs opposite to its class (shown as a deduction)
#                 "control"   one account for many parties — the journal `party` column
#                             keeps the party-wise খতিয়ান / ledger, never one account per party
#                 "cash" "bank" "mfs"   money accounts — every posting needs a doc_ref
#                 "vds" "tds" "withholding"  tells validate.py the account is a tax control
#                 "inactive"  retire an account you no longer post to (validate.py warns)
#               Tally-era aliases (sundry-debtors, sundry-creditors, duties-and-taxes) are
#               kept as tags so the assistant maps what the owner says to the right code.
#
# TWO RULES THAT FALL OUT OF THE 9xxx BLOCK
#   1. Never net. 9100 is never netted against 9200 in the ledger, nor 9300 against 9320.
#      মূসক ৯.১ / Mushak 9.1 and the income tax return both want the gross figures.
#   2. Every 9xxx balance must be provable by a document: 9100 by a মূসক ৬.৩ / Mushak 6.3
#      tax invoice entered in মূসক ৬.১ / Mushak 6.1; 9120 by a মূসক ৬.৬ / Mushak 6.6 received;
#      9220 by a Mushak 6.6 issued plus a treasury challan; 9300 by a deduction certificate.
#
# NO RATE, THRESHOLD, DEADLINE OR SECTION NUMBER APPEARS IN THIS FILE — by design.
# Those live in src/data/rates-AY<year>.toml with a source URL and a verified flag.
# =========================================================================================


